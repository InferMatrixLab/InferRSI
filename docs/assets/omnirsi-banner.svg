<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-desc" xml:lang="en">
  <title id="banner-title">OmniRSI — Faster inference. Verifiable progress.</title>
  <desc id="banner-desc">ThinkFlowLab's inference optimization workbench. A loop connects profiling, optimization, validation, and reuse of knowledge.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#172342"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8095B7"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <path d="M 650 0 L 520 320 M 850 0 L 720 320 M 1050 0 L 920 320" stroke="#233352" stroke-width="1" opacity="0.65"/>
  <rect x="52" y="43" width="44" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="52" y="81" font-size="14" font-weight="700" letter-spacing="2" fill="#A9BBD4">THINKFLOWLAB / INFERENCE SYSTEMS</text>
    <text x="48" y="177" font-size="86" font-weight="700" letter-spacing="-3" fill="#F8FAFC">Omni<tspan fill="#5EEAD4">RSI</tspan></text>
    <text x="52" y="224" font-size="25" fill="#DBE6F4">Faster inference. Verifiable progress.</text>
    <text x="52" y="276" font-size="14" letter-spacing="1" fill="#9CADC7">BENCHMARKS · QUALITY GATES · REUSABLE KNOWLEDGE</text>
    <path d="M 880 105 H 964 M 1050 137 V 181 M 966 215 H 882 M 795 181 V 137" fill="none" stroke="#8095B7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="706" y="73" width="174" height="64" rx="12" fill="#16343E" stroke="#4FD1C5"/>
    <rect x="966" y="73" width="174" height="64" rx="12" fill="#283054" stroke="#A5B4FC"/>
    <rect x="966" y="183" width="174" height="64" rx="12" fill="#173444" stroke="#7DD3FC"/>
    <rect x="706" y="183" width="174" height="64" rx="12" fill="#283054" stroke="#C4B5FD"/>
    <g font-size="19" font-weight="700" text-anchor="middle" fill="#F1F5F9">
      <text x="793" y="112">Profile</text>
      <text x="1053" y="112">Optimize</text>
      <text x="1053" y="222">Validate</text>
      <text x="793" y="222">Reuse</text>
    </g>
    <text x="923" y="281" text-anchor="middle" font-size="14" fill="#A9BBD4">Every experiment feeds the next.</text>
  </g>
</svg>
