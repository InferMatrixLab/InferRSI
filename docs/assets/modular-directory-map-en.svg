<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="536" viewBox="0 0 1120 536" role="img" aria-labelledby="title desc">
  <title id="title">Selected directories under src/inferrsi/</title>
  <desc id="desc">Apps owns the CLI, host bindings and workflows. Harness runs trials, Benchmark defines and assesses tasks, and Knowledge owns retrieval and the skill library. RunSpec and the repository pack reader have separate paths.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f4f7fc; }
      .title { font-size: 32px; font-weight: 700; }
      .package, .path { font-family: "SFMono-Regular", Consolas, monospace; }
      .package { font-size: 24px; font-weight: 700; }
      .path { font-size: 18px; fill: #f4f7fc; }
      .body { font-size: 18px; fill: #c7d5e7; }
    </style>
  </defs>
  <rect width="1120" height="536" rx="16" fill="#0b1220"/>
  <text x="32" y="51" class="title">Where to extend InferRSI</text>
  <text x="32" y="82" class="body">Selected paths under src/inferrsi/</text>

  <rect x="32" y="106" width="516" height="140" rx="12" fill="#142139" stroke="#49678b"/>
  <text x="52" y="143" class="package" style="fill:#a6bfff">apps/</text>
  <text x="52" y="178" class="path">cli/</text>
  <text x="254" y="178" class="body">Command entry and arguments</text>
  <text x="52" y="203" class="path">host/</text>
  <text x="254" y="203" class="body">Repository and device probes</text>
  <text x="52" y="228" class="path">workflows/</text>
  <text x="254" y="228" class="body">Application assembly</text>

  <rect x="572" y="106" width="516" height="140" rx="12" fill="#14283a" stroke="#4083ad"/>
  <text x="592" y="143" class="package" style="fill:#85d3ff">harness/</text>
  <text x="592" y="178" class="path">manager/</text>
  <text x="801" y="178" class="body">AB/BA trials</text>
  <text x="592" y="203" class="path">executor/</text>
  <text x="801" y="203" class="body">Deadlines and cleanup</text>
  <text x="592" y="228" class="path">records/</text>
  <text x="801" y="228" class="body">Campaign records and traces</text>

  <rect x="32" y="266" width="516" height="140" rx="12" fill="#26223e" stroke="#7866a6"/>
  <text x="52" y="303" class="package" style="fill:#c6b2ff">benchmark/</text>
  <text x="52" y="338" class="path">tasks/</text>
  <text x="254" y="338" class="body">Packaged workloads</text>
  <text x="52" y="363" class="path">metrics.py</text>
  <text x="254" y="363" class="body">Metric contract</text>
  <text x="52" y="388" class="path">validators/</text>
  <text x="254" y="388" class="body">Output quality checks</text>

  <rect x="572" y="266" width="516" height="140" rx="12" fill="#152c2a" stroke="#3e927f"/>
  <text x="592" y="303" class="package" style="fill:#75e3c8">knowledge/</text>
  <text x="592" y="338" class="path">catalog.py</text>
  <text x="801" y="338" class="body">Search and cited context</text>
  <text x="592" y="363" class="path">data/skill_library/</text>
  <text x="801" y="363" class="body">Procedures and findings</text>

  <text x="32" y="460" class="path">contracts/runspec.py</text>
  <text x="420" y="460" class="body">Immutable experiment specification</text>
  <text x="32" y="499" class="path">resources/repository_packs.py</text>
  <text x="420" y="499" class="body">Shared reader for repository descriptions</text>
</svg>
