<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="component-title component-desc" xml:lang="en">
<title id="component-title">InferRSI components: CLI arguments, shared control core, repository and accelerator adapters</title>
<desc id="component-desc">Users configure runs through CLI arguments. The Controller manages state and budgets; agents propose candidates; TargetAdapter and PlatformAdapter provide repository and device plans; the Runner executes; the Evaluator judges evidence. Knowledge, Storage, Reporting, and Skill Hub preserve and reuse results. This is the target architecture; see the documentation for the first-release boundary.</desc>
