<text x="24.0" y="78.0" font-size="9.4" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#52514e">Illustrative shape only. Values are the template example, not any engine's measurements.</text>
<text x="24.0" y="94.0" font-size="9.4" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" fill="#52514e">Each marker is the running multiple of the baseline; a step that changed nothing reads as a flat segment.</text>
