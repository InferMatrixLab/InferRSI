<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1080" viewBox="0 0 1320 1080" role="img" aria-labelledby="title desc"><title id="title">InferRSI implemented module architecture</title><desc id="desc">The entry layer composes Harness, Model and Infra. Shared modules are implemented; historical validators remain frozen. Automatic agents and distributed executors are future work.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#667b9e" stroke-width="1.5"/></marker></defs>
<rect width="1320" height="1080" fill="#0b1220"/>
<text x="48" y="56" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#69dfc4">INFERRSI / IMPLEMENTED ARCHITECTURE</text>
<text x="48" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#f4f7fc">One experiment loop. Independent extension boundaries.</text>
<rect x="48" y="140" width="1224" height="106" rx="18" fill="#142139" stroke="#30435f"/>
<text x="72" y="175" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#a6bfff">ENTRY + KNOWLEDGE</text>
<text x="72" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#f4f7fc">CLI → immutable RunSpec   •   Knowledge search → cited manual context</text>
<path d="M660 246 L660 284" fill="none" stroke="#667b9e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="294" width="1224" height="240" rx="18" fill="#14283a" stroke="#4083ad"/>
<text x="72" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#77cafa">HARNESS / ORCHESTRATION</text>
<rect x="72" y="352" width="382" height="152" rx="12" fill="#0f1e30" stroke="#304e69"/>
<text x="92" y="383" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#f4f7fc">Runner + external scenario</text>
<text x="92" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">AB/BA order and deadline</text>
<text x="92" y="445" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">Source checks and trial evidence</text>
<text x="92" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">execute / snapshot / metric hooks</text>
<rect x="470" y="352" width="380" height="152" rx="12" fill="#0f1e30" stroke="#304e69"/>
<text x="490" y="383" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#f4f7fc">Media scenario</text>
<text x="490" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">Warmups and seed ordering</text>
<text x="490" y="445" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">First response + sample artifacts</text>
<text x="490" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">Request callback; no model dispatch</text>
<rect x="866" y="352" width="382" height="152" rx="12" fill="#0f1e30" stroke="#304e69"/>
<text x="886" y="383" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#f4f7fc">Evaluation + reporting</text>
<text x="886" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">Performance and quality evidence</text>
<text x="886" y="445" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">PASS / FAIL / INCONCLUSIVE</text>
<text x="886" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c1cee1">JSON records + HTML report</text>
<path d="M338 534 L338 581" fill="none" stroke="#667b9e" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M970 534 L970 581" fill="none" stroke="#667b9e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="466" y="567" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#91a8c4">Scenario adapters compose these layers</text>
<rect x="48" y="594" width="566" height="222" rx="18" fill="#152c2a" stroke="#3e927f"/>
<text x="72" y="632" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#69dfc4">MODEL / CONTRACTS</text>
<text x="72" y="670" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#f4f7fc">Protocols + validators</text>
<text x="72" y="706" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c1cee1">Image payloads and metric interpretation</text>
<text x="72" y="737" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c1cee1">PNG/hash checks; RGB + alpha comparison</text>
<text x="72" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c1cee1">Campaign supplies model, settings and gates</text>
<rect x="676" y="594" width="596" height="222" rx="18" fill="#26223e" stroke="#7866a6"/>
<text x="700" y="632" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#b6a2ed">INFRA / EXECUTION</text>
<text x="700" y="670" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#f4f7fc">Targets + platforms + processes</text>
<text x="700" y="706" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c1cee1">Source identity; device discovery / qualification</text>
<text x="700" y="737" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c1cee1">Subprocess lifetime, HTTP timing and artifacts</text>
<text x="700" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c1cee1">No model constants or performance verdicts</text>
<path d="M614 735 L666 735" fill="none" stroke="#667b9e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="622" y="722" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#91a8c4">uses</text>
<rect x="48" y="858" width="1224" height="116" rx="18" fill="#2c261d" stroke="#947342"/>
<text x="72" y="894" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f0c678">COMPATIBILITY BOUNDARY</text>
<text x="72" y="924" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c1cee1">Old CLI / import paths remain available. Historical LTX helpers and quality validators stay frozen.</text>
<text x="72" y="952" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c1cee1">New campaigns use shared modules and fresh helper hashes; old evidence keeps its original bundle.</text>
<text x="48" y="1016" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#f4f7fc">Extend model / repository / hardware adapters without editing AB/BA, process cleanup or adjudication.</text>
<text x="48" y="1050" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#91a8c4">Future work: automatic planning and patching, SSH execution, distributed leases and Hub publication.</text>
</svg>
