<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="466" viewBox="0 0 1120 466" role="img" aria-labelledby="title desc">
  <title id="title">How InferRSI assembles a benchmark</title>
  <desc id="desc">Apps connects Knowledge retrieval, Harness execution and Benchmark assessment. CLI flags and result formats survive the module moves. Python callers must update retired imports.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#8ca3bf" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f4f7fc; }
      .title { font-size: 32px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 650; }
      .body { font-size: 18px; fill: #c7d5e7; }
      .edge { stroke: #8ca3bf; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1120" height="466" rx="16" fill="#0b1220"/>
  <text x="32" y="53" class="title">How InferRSI assembles a benchmark</text>

  <rect x="32" y="80" width="1056" height="80" rx="12" fill="#142139" stroke="#49678b"/>
  <text x="54" y="113" class="label" style="fill:#a6bfff">Apps</text>
  <text x="54" y="140" class="body">The CLI resolves the task and target. Workflows connect the inputs, execution and assessment.</text>
  <g class="edge">
    <path d="M560 160 V183 M200 183 H920"/>
    <path d="M200 183 V207" marker-end="url(#arrow)"/>
    <path d="M560 183 V207" marker-end="url(#arrow)"/>
    <path d="M920 183 V207" marker-end="url(#arrow)"/>
  </g>

  <rect x="32" y="214" width="336" height="128" rx="12" fill="#152c2a" stroke="#3e927f"/>
  <text x="52" y="250" class="label" style="fill:#75e3c8">Knowledge</text>
  <text x="52" y="282" class="body">Retrieves cited procedures, cases</text>
  <text x="52" y="307" class="body">and records when requested.</text>

  <rect x="392" y="214" width="336" height="128" rx="12" fill="#14283a" stroke="#4083ad"/>
  <text x="412" y="250" class="label" style="fill:#85d3ff">Harness</text>
  <text x="412" y="282" class="body">Executes trials, manages deadlines</text>
  <text x="412" y="307" class="body">and records what ran.</text>

  <rect x="752" y="214" width="336" height="128" rx="12" fill="#26223e" stroke="#7866a6"/>
  <text x="772" y="250" class="label" style="fill:#c6b2ff">Benchmark</text>
  <text x="772" y="282" class="body">Supplies the packaged workload,</text>
  <text x="772" y="307" class="body">metrics and assessment rules.</text>

  <rect x="32" y="369" width="1056" height="73" rx="12" fill="#24271f" stroke="#82764f"/>
  <text x="54" y="398" class="label" style="fill:#f0d398">Compatibility across module moves</text>
  <text x="54" y="425" class="body">CLI flags, external JSON metrics, run artifacts and reports are retained. Retired Python imports must be updated.</text>
</svg>
