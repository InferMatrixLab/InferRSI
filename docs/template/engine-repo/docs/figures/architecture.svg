<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Engine architecture template</title>
  <desc id="desc">Illustrative request path from client through API, input preparation, scheduler, model execution and response. An optional worker shows a separate process and transfer boundary. Replace all boxes with the implemented engine topology.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#42658c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #26364a; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .detail { font-size: 15px; }
      .box { fill: #fff; stroke: #9caec2; stroke-width: 1.4; }
      .flow { fill: none; stroke: #42658c; stroke-width: 2; marker-end: url(#arrow); }
      .optional { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1200" height="850" fill="#fff"/>
  <text x="50" y="43" font-size="29" font-weight="700">Engine architecture</text>
  <text x="50" y="75" font-size="17" fill="#995c00">TEMPLATE ONLY · adapt stages, modules and process/device ownership to the implementation</text>

  <rect x="50" y="105" width="1100" height="64" rx="8" fill="#e7f0fb" stroke="#8daaca"/>
  <text x="70" y="131" class="label">Client / request entry</text>
  <text x="70" y="154" class="detail">Serving API or offline call · input schema · generation controls · response contract</text>
  <path d="M410 169 V202" class="flow"/>

  <rect x="50" y="205" width="720" height="505" rx="10" fill="#f3f6fa" stroke="#91a5bc"/>
  <text x="70" y="234" class="heading">Engine process · define thread and state ownership</text>
  <rect x="70" y="250" width="680" height="65" rx="6" class="box"/>
  <text x="90" y="276" class="label">API / entrypoint</text>
  <text x="90" y="300" class="detail">Validation · admission · readiness · cancellation / cleanup</text>
  <path d="M205 315 V347" class="flow"/>

  <rect x="70" y="350" width="270" height="90" rx="6" class="box"/>
  <text x="90" y="378" class="label">Input preparation</text>
  <text x="90" y="403" class="detail">Tokenizer / processor / encoders</text>
  <text x="90" y="426" class="detail">Keep only supported modalities</text>
  <path d="M340 395 H417" class="flow"/>
  <rect x="420" y="350" width="330" height="90" rx="6" class="box"/>
  <text x="440" y="378" class="label">Scheduler / batch formation</text>
  <text x="440" y="403" class="detail">Queue · resource budget · backpressure</text>
  <text x="440" y="426" class="detail">Request lifetime and persistent state</text>
  <path d="M585 440 V477" class="flow"/>

  <rect x="70" y="480" width="680" height="130" rx="6" fill="#e5f1ef" stroke="#7da99f"/>
  <text x="90" y="507" class="label">Model execution · identify device(s) and memory owner</text>
  <text x="90" y="534" class="detail">Model stages: prefill / decode, denoising or modality-specific execution</text>
  <text x="90" y="560" class="detail">Backend operators / kernels / graphs · implemented fast path and fallback</text>
  <text x="90" y="586" class="detail">Weights / KV cache / buffers · allocation, lifetime and sharing</text>
  <path d="M410 610 V647" class="flow"/>

  <rect x="70" y="650" width="680" height="42" rx="6" class="box"/>
  <text x="90" y="677" class="label">Output assembly / streaming · decode, ordering and completion</text>

  <rect x="810" y="205" width="340" height="505" rx="10" fill="#fff8eb" stroke="#bda574" stroke-width="1.5" class="optional"/>
  <text x="830" y="234" class="heading">Optional worker process</text>
  <text x="830" y="260" class="detail">Remove this lane when absent</text>
  <rect x="830" y="335" width="300" height="95" rx="6" class="box"/>
  <text x="850" y="362" class="label">Transfer / work queue</text>
  <text x="850" y="388" class="detail">IPC or device transfer</text>
  <text x="850" y="411" class="detail">Payload, ownership, synchronization</text>
  <path d="M750 395 H827" class="flow optional"/>
  <path d="M980 430 V477" class="flow optional"/>
  <rect x="830" y="480" width="300" height="130" rx="6" class="box"/>
  <text x="850" y="509" class="label">Auxiliary execution</text>
  <text x="850" y="536" class="detail">Actual model stage / postprocessor</text>
  <text x="850" y="562" class="detail">Device and memory assignment</text>
  <text x="850" y="588" class="detail">Shared-resource coordination</text>
  <path d="M980 610 V671 H753" class="flow optional"/>

  <path d="M410 692 V747" class="flow"/>
  <rect x="50" y="750" width="1100" height="55" rx="8" fill="#e7f0fb" stroke="#8daaca"/>
  <text x="70" y="784" class="label">Response to client · text / image / audio / video as supported · stream chunks or complete output</text>
  <text x="50" y="834" font-size="14" fill="#596c82">Solid arrows: core request path. Dashed lane/arrows: optional worker. Map each retained box to real code in docs/architecture.md.</text>
</svg>
