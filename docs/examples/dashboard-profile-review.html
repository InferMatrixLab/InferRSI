<style>
:root{color-scheme:dark;--bg:#0c121c;--panel:#121c29;--line:#304152;--sub:#adbdce;--text:#edf3f8;--accent:#69e5cd;--green:var(--accent);--red:#ff91a0;--violet:#aaaafa;--dim:#98a9bd;--muted:var(--sub)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
main,header>div{width:min(1454px,calc(100% - clamp(24px,6vw,96px)));margin:auto}
header{border-bottom:1px solid var(--line);background:var(--panel)}
header>div{display:flex;align-items:center;gap:14px;min-height:52px;flex-wrap:wrap;padding:8px 0}
header small{color:var(--sub)}#mode{margin-inline-start:auto;color:#bed7e0;font:12px Consolas,monospace}
#connection{color:var(--accent)}#connection:empty{display:none}
#language{color:var(--text);background:#1b2939;min-height:34px}
button,summary{cursor:pointer;color:var(--accent)}
button{background:transparent;border:1px solid var(--line);border-radius:4px;padding:.35em .8em}
:focus-visible{outline:3px solid #ffe396;outline-offset:3px}
main{padding:28px 0 58px}
#campaign{overflow-wrap:anywhere}
.review-banner{margin-bottom:16px}
#review-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));gap:6px;margin:12px 0 16px}
#review-links a{min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:8px 14px;
  border:1px solid #365663;border-radius:7px;background:#142832;color:var(--text);font-weight:600;text-decoration:none}
#review-links a::before{content:attr(data-caption);color:var(--accent);font-size:12px;font-weight:500}
#review-links a:hover{background:#203d49;text-decoration:underline}
#review-links a[hidden]{display:none}
@media(min-width:860px){#review-links{grid-column:1/-1;margin:0}}
#synthetic{color:#ffce84;font-size:11px;font-weight:650;letter-spacing:.06em}
main>section{min-width:0;margin-bottom:14px;padding:16px 20px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
main>section:has(>.panel[open]){border-color:#476477}
.panel>summary{padding:4px 0}
.panel>summary:hover{color:var(--accent)}
#story-checks{border-left:3px solid #edb769;overflow-wrap:anywhere}
h1,h2,h3,p,figure,dl{margin:0}h1,h2{font-size:20px;line-height:1.35;margin-bottom:12px}h3{font-size:16px}
p+p{margin-top:6px}.goal{font-size:19px;font-weight:550}.note,small,dt{color:var(--sub)}
ul{margin:.45em 0 0;padding-left:1.35em}code,pre,.value,td{font-variant-numeric:tabular-nums}
code,pre{font-family:Consolas,"Microsoft YaHei",monospace}code{overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0 0}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px 9px 7px 0;vertical-align:top}
th{font-size:13px;color:var(--sub);font-weight:500}.value{font-weight:650}
.metrics{display:flex;gap:18px 40px;flex-wrap:wrap;margin:14px 0}
.metrics dd{margin:2px 0 0;font-weight:650;font-size:22px;line-height:1.4}.metrics dt{font-size:13px}
.round{border-top:1px solid var(--line);padding:16px 0}.round h3,.round p{overflow-wrap:anywhere}
.round .facts{display:flex;gap:6px 22px;flex-wrap:wrap;padding:4px 0;color:var(--accent);font-size:14px}
.round .basis{color:var(--sub);font-size:14px}.round .basis code{color:var(--text)}
.tag{display:inline-block;margin-right:8px;color:var(--accent);font-size:13px}
details{margin-top:8px;font-size:13px}details details{margin-left:10px}
.panel{margin:0;font-size:inherit}.panel>summary{font-weight:650;color:var(--text)}
.panel-heading{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%)}
.panel>summary{font-size:17px}.panel[open]>summary{margin-bottom:14px}
.panel>summary::marker{color:var(--accent)}.panel .capture, .panel td{overflow-wrap:anywhere}
.timing-scroll,.table-scroll{overflow-x:auto}.experiment-lane{display:grid;grid-template-columns:minmax(90px,17%) 1fr;align-items:center;gap:8px;margin:6px 0;color:var(--sub)}
.experiment-track{height:19px;position:relative;background:var(--bg);border-radius:3px}
.experiment-track button{position:absolute;background:var(--accent);border:0;padding:0;min-width:2px}
.experiment-track .interval{height:7px;top:6px}.experiment-track .instant{height:13px;top:3px;width:2px;background:#dcb272}
.experiment-lane:nth-of-type(2) .interval{background:#c3a6fa}.experiment-lane:nth-of-type(3) .interval{background:#6bc1ad}
.experiment-steps{max-height:32rem;overflow:auto}.experiment-steps thead{position:sticky;top:0;background:var(--panel)}
.experiment-steps.timing-scroll td:last-child{white-space:normal;text-align:left}.experiment-steps td:first-child{min-width:12em}
#baseline>h3:not(:first-child){margin-top:20px}
.timing-scroll table{width:auto;min-width:min(100%,600px)}
.timing-scroll td:not(:first-child),.timing-scroll th:not(:first-child){text-align:right;white-space:nowrap}
.capture-fold{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.capture-fold>summary{font-weight:600}.capture-fold details{margin-block:8px}
details p,details pre{margin:5px 0 4px 12px;overflow-wrap:anywhere}
pre{max-height:22rem;overflow:auto;white-space:pre-wrap;padding:9px 12px;background:var(--bg);color:var(--sub)}
.trend{grid-column:1/-1}.trend figure{margin:0;min-width:0}#chart{min-width:0;overflow-x:auto}
.trend-overview{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,2fr);gap:16px;margin-bottom:14px;align-items:start}
.trend-overview[hidden]{display:none}#paired-chart{overflow:auto;min-width:0}
#paired-chart svg{display:block;width:100%;min-width:640px;height:auto;border-radius:7px}
#paired-chart svg>rect:first-of-type{fill:#101c29}#paired-chart polyline{stroke:var(--accent);stroke-width:3}#paired-chart circle{fill:var(--accent)}
#chart-note{font-size:13px;margin-bottom:8px}
.trend-rounds{display:grid;gap:4px;max-height:32rem;overflow:auto}
.trend-rounds button{display:grid;grid-template-columns:3em 1fr auto;align-items:center;gap:2px 8px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#182737;color:var(--text);font:inherit;font-size:13px;text-align:left}
.trend-rounds button:hover{border-color:var(--accent)}.trend-rounds .round-number{grid-row:span 2;color:var(--accent);font:600 14px Consolas,monospace}
.trend-rounds strong{overflow-wrap:anywhere}.trend-rounds small{grid-column:2/-1;overflow-wrap:anywhere}
.trend-rounds .round-gain{font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:859px){.trend-overview{grid-template-columns:minmax(0,1fr)}}
.capture+.capture{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.capture h3{margin:0 0 4px}.capture .meta{font:13px/1.65 Consolas,"Microsoft YaHei",monospace;color:var(--sub);overflow-wrap:anywhere}
.capture h4{font-size:14px;margin:12px 0 5px}.capture>p{margin:5px 0}
.trace-controls,.legend{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin:10px 0}
.trace-controls button{font:inherit;font-size:14px;padding:3px 10px}.trace-controls button:disabled{color:var(--sub);opacity:.55;cursor:default}
.trace-controls input{flex:1 1 110px;max-width:300px;accent-color:var(--accent)}
.trace-controls output{font:13px Consolas,monospace;color:var(--sub)}
.legend{font-size:12px;color:var(--sub)}.legend span:before{display:inline-block;content:"";width:9px;height:9px;border-radius:2px;background:var(--swatch);margin-right:5px}
.trace-scroll{max-height:390px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:5px}
.track{display:grid;grid-template-columns:minmax(92px,17%) minmax(0,1fr);align-items:center;min-height:35px;border-bottom:1px solid #30353c;background:#16191d}
.track:last-child{border-bottom:0}.track-label{padding:4px 8px;font:12px/1.3 Consolas,"Microsoft YaHei",monospace;color:#c1ccd4;overflow-wrap:anywhere}
.track canvas{display:block;width:100%;height:34px;touch-action:pan-y;cursor:crosshair}
.scale{position:sticky;top:0;background:#20262d;z-index:1;min-height:25px}.ticks{display:flex;justify-content:space-between;font:11px Consolas,monospace;color:var(--sub);padding:2px 4px}
.selection{font:13px/1.5 Consolas,"Microsoft YaHei",monospace;overflow-wrap:anywhere;color:var(--accent);min-height:1.6em}
.file-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.file-tools input{max-width:100%;font-size:12px}
.trace-table{overflow:auto;max-height:280px}.trace-table th{position:sticky;top:0;background:var(--panel)}.trace-table td{overflow-wrap:anywhere}
.trace-table button{font:inherit;text-align:left;border:0;padding:0}.trace-status{color:var(--accent)}a{color:var(--accent)}
.decisions{display:grid;gap:8px}.decision{display:grid;grid-template-columns:4em 9em 1fr;gap:12px;border-top:1px solid var(--line);padding-top:8px}
@supports selector(section:has(details[open])){
  @media(min-width:860px){
    main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:12px}
    .review-banner,main>section:has(>.panel[open]),#knowledge-navigation{grid-column:1/-1}
    main>section,.review-banner{margin:0}
  }
}
@media(max-width:640px){main,header>div{width:calc(100% - 24px)}main>section{padding:12px;margin-bottom:10px}main{padding:16px 0}.metrics{gap:10px 20px}.decision{grid-template-columns:3em 1fr;gap:4px}.decision .note{grid-column:2}header>div{gap:8px}.goal{font-size:17px}}

<section class="verdict-summary" data-no-translate aria-labelledby="verdict-title">
    <div id="verdict-ring" class="verdict-ring" aria-hidden="true"><strong id="verdict-total"></strong></div>
    <div><h2 id="verdict-title">Candidate verdicts</h2><dl class="verdict-legend" id="verdict-legend"></dl></div>
  </section>
<script>
window.InferRSIVerdicts = (rows, translate, node) => {
    const byId=id=>document.getElementById(id);
    byId('verdict-title').textContent=translate('Candidate verdicts');
    const legend=byId('verdict-legend'), stops=[];
    const counts={PASS:0,FAIL:0,INCONCLUSIVE:0,'Not recorded':0};
    for(const row of rows){
      const verdict=row.verdict;
      counts[Object.hasOwn(counts,verdict)?verdict:'Not recorded']++;
    }
    let offset=0;
    legend.replaceChildren();
    for(const [label,colour] of [['PASS','var(--green)'],['FAIL','var(--red)'],['INCONCLUSIVE','var(--violet)'],['Not recorded','var(--dim)']]){
      const count=counts[label], part=node('div');
      part.style.setProperty('--swatch',colour);
      part.append(node('dt',translate(label)),node('dd',rows.length?String(count):'—'));legend.append(part);
      if(count){
        const end=offset+100*count/rows.length;
        stops.push(`${colour} ${offset}% ${end}%`);offset=end;
      }
    }
    byId('verdict-total').textContent=rows.length?String(rows.length):'—';
    byId('verdict-ring').style.background=stops.length?`conic-gradient(from -90deg,${stops.join(',')})`:'';
};
</script>

    'SYNTHETIC DATA':'合成数据', 'successes':'成功叙述','failures':'失败叙述',
    'run_state':'运行状态','quality':'质量检查','failure':'失败','incomplete':'未完成',
    'completed':'已完成','failed':'失败','crashed':'崩溃','running':'运行中','cancelled':'已取消',
    'passed':'通过','not_recorded':'未记录','position not recorded':'未记录位置',
    'no plottable measurement':'无可绘制测量值',
    'native comparison evidence incomplete':'原生运行的可比性证据不完整',
    'different recorded configuration; separate series':'运行配置不同；使用独立曲线',
    'unsupported configuration fields':'存在不支持的配置字段',
    'unknown reference role':'参考角色未知','missing provenance or incompatible unit':'缺少来源或单位不兼容',
    'unknown optimization direction':'优化方向未知','target freeze not recorded':'未记录目标冻结',
    'invalid reference value':'参考值无效','only frozen targets support conversion':'仅冻结目标允许换算',
    'missing or ambiguous conversion reference':'转换参考缺失或不唯一',
    'invalid improvement percentage':'改善百分比无效','invalid inverse latency ratio':'逆延迟比例无效',
    'unsupported target definition or direction':'目标定义或方向不支持转换','non-finite conversion':'转换结果非有限值'
  };
  const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
  function scrollRegion(label){
    const region=el('div',undefined,'xp-scroll');
    region.tabIndex=0;
    region.setAttribute('role','region');
    region.setAttribute('aria-label',label);
    return region;
  }
  const svg=(tag,attrs,text)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n;};
  const number=v=>Number.isFinite(v)?Number(v.toPrecision(6)).toString():'—';
  const position=(p,axis)=>axis==='timestamp'?(p.timestamp?Date.parse(p.timestamp):null):p[axis];
  const roleLabel={local_baseline:'Local baseline',external_reference:'External reference',frozen_target:'Frozen target'};
  function create({getData,getLanguage,openExperiment,narrative=s=>s}) {
    const state={workload:'',metric:'',axis:'round',selected:null};
    let moreAxesOpen=false;
    let roots=[];
    const t=s=>{
      if(getLanguage()!=='zh')return s;
      if(words[s])return words[s];
      for(const [prefix,label] of [['missing configuration: ','缺少配置：'],['unknown configuration: ','未知配置：'],['missing dimension: ','缺少维度：'],['missing axis: ','缺少坐标信息：']])if(s?.startsWith(prefix))return label+s.slice(prefix.length);
      return s;
    };
    const description=item=>item.description_kind==='recorded'?t(item.description):narrative(item.description||'');
    const projection=()=>getData().experiments||{points:[],events:[]};
    const shown=p=>(!state.workload||p.workload===state.workload)&&(!state.metric||p.metric===state.metric);
    const eventShown=e=>(!state.workload||!e.workloads.length||e.workloads.includes(state.workload))&&(!state.metric||!e.metrics.length||e.metrics.includes(state.metric));
    const xText=p=>{const x=position(p,state.axis);return Number.isFinite(x)?state.axis==='timestamp'?new Date(x).toISOString():String(x):t('Unpositioned records');};
    const bind=(n,id)=>{
      n.dataset.xpId=id;n.setAttribute('aria-pressed',String(state.selected===id));
      const activate=()=>{

        const inspector=n.closest('[data-review-overview]')?.querySelector('.xp-inspect');

      };
      n.addEventListener('click',activate);
      if(n.getAttribute('role')==='button')n.addEventListener('keydown',event=>{
        if(event.key==='Enter'||event.key===' '){event.preventDefault();activate();}
      });
      n.addEventListener('focus',()=>select(id));n.addEventListener('mouseenter',()=>select(id));
    };
    function select(id){state.selected=id;for(const root of roots.filter(r=>r.isConnected)){

    }}
    function refs(root,items){
      for(const ref of items||[]){const n=el('p',`${ref.path||ref.ref||ref.kind||t('Evidence')} · ${ref.state==='present'||ref.state==='recorded'?ref.sha256||ref.state:t('Unavailable')+' · '+(ref.missing_reason||ref.state||t('Not recorded'))}`,'xp-note');root.append(n);}
    }
    function detail(box){
      box.replaceChildren();const {points,events}=projection();
      const p=points.find(p=>p.id===state.selected),e=events.find(e=>e.id===state.selected),item=p||e;
      const summary=box.closest('.xp-inspect')?.querySelector('summary');
      if(summary)summary.textContent=[t('Selected evidence and experiment events'),item?.title?narrative(item.title):null].filter(Boolean).join(' · ');
      if(!item){box.append(el('p',t(state.selected?'Selection no longer available':'Select a measurement or event to inspect its evidence.')));return;}
      box.append(el('strong',item.title?narrative(item.title):description(item)));
      if(!(p?shown(p):eventShown(e)))box.append(el('p',t('Selected record is outside this filter'),'xp-note'));
      const dl=el('dl');box.append(dl);
      const field=(label,value)=>{dl.append(el('dt',t(label)),el('dd',value??t('Not recorded')));};
      field('Experiment',item.candidate_id||item.experiment_ids?.join(', '));
      if(item.run_id)field('Run',item.run_id);else if(item.source_record)field('Source record',item.source_record);
      field('Axis',xText(item));
      if(p){field('Measurement',p.measurement_id);field('Value',number(p.value)+' '+(p.unit||''));field('Workload',p.workload);field('Metric',p.metric);field('Scope',p.scope);field('Statistic',p.statistic);field('Samples',p.sample_count);
        field('Configuration',JSON.stringify(p.configuration));field('Reason',[...p.plot_reasons,...p.comparison_reasons,p.group_note].filter(Boolean).map(t).join('; ')||p.series_id);
      }
      field('Quality',t(item.quality)||t('Not recorded'));field('Evidence verdict',item.verdict);
      field('Narrative category',item.narrative_category?t(item.narrative_category):t('Not recorded'));
      field('Description',description(item));
      if(item.cause_stage)field('Reason',item.cause_stage);
      if(p){for(const ref of p.references){
        const line=el('p');line.append(el('strong',t(roleLabel[ref.role]||ref.role)+': '),document.createTextNode(number(ref.value)+' '+p.unit));box.append(line);
        box.append(el('p',t('Provenance')+': '+ref.provenance,'xp-note'));
        box.append(el('p',t('Conversion')+': '+ref.formula+' · '+number(ref.original_value)+' · '+ref.definition,'xp-note'));
        if(ref.reason)box.append(el('p',t('Unavailable')+': '+t(ref.reason),'xp-note'));
        const gap=p.target_gaps.find(g=>g.reference_id===ref.id);if(gap)box.append(el('p',t('Gap to target')+': '+number(gap.gap)+' '+p.unit+' · '+t('A numeric target comparison does not establish a campaign PASS.'),'xp-note'));
      }}
      if(e){
        const linked=points.filter(point=>e.experiment_ids.includes(point.experiment_id));
        if(linked.length){box.append(el('h3',t('Related measurements')));for(const point of linked){const b=el('button',`${point.workload||'—'} · ${point.run_id||point.source_record} · ${number(point.value)} ${point.unit||''}`);b.type='button';b.onclick=()=>select(point.id);box.append(b);}}
      }else{
        const linked=events.filter(event=>event.experiment_ids.includes(p.experiment_id));
        if(linked.length){box.append(el('h3',t('Recorded events')));for(const event of linked){const b=el('button',t(event.category)+' · '+description(event));b.type='button';b.onclick=()=>select(event.id);box.append(b);}}
      }
      refs(box,item.refs);
      const ids=p?[p.experiment_id]:e.experiment_ids;
      if(ids.length>1)box.append(el('p',t('Choose a run')));
      for(const id of ids){const row=getData().candidates.find(r=>r.experiment_id===id);if(!row)continue;const button=el('button',t('Open experiment')+' · '+(row.run_id||row.title));button.type='button';button.onclick=()=>openExperiment(id);box.append(button);}
    }
    function controls(root){
      const {points,events}=projection(),bar=el('div',undefined,'xp-controls');root.append(bar);
      const selector=(key,label,choices)=>{const wrap=el('label',t(label)),select=el('select');select.dataset.xpControl=key;select.setAttribute('aria-label',t(label));
        for(const [value,name] of choices){const o=el('option',name);o.value=value;select.append(o);}
        if(!choices.some(([v])=>v===state[key])){const o=el('option',state[key]+' · '+t('Unavailable'));o.value=state[key];select.append(o);}

      selector('workload','Workload',[['',t('All workloads')],...[...new Set([...points.map(p=>p.workload),...events.flatMap(e=>e.workloads)])].filter(Boolean).sort().map(s=>[s,s])]);
      selector('metric','Metric',[['',t('All metrics')],...[...new Set([...points.map(p=>p.metric),...events.flatMap(e=>e.metrics)])].filter(Boolean).sort().map(s=>[s,s])]);
      const axes=[['round',t('Recorded round')]];
      if([...points,...events].some(p=>p.order!==null&&p.order!==undefined))axes.push(['order',t('Recorded order')]);
      if([...points,...events].some(p=>p.timestamp))axes.push(['timestamp',t('Recorded time')]);
      selector('axis','Axis',axes);
    }
    function chart(root,points,events,showReferences){
      const first=points[0],card=el('section',undefined,'xp-card');root.append(card);
      const title=[first.workload,first.metric,first.scope,first.statistic].filter(Boolean).join(' · ');

      const plotted=points.filter(p=>p.value!==null&&!p.plot_reasons.some(r=>r.startsWith('missing axis:'))&&Number.isFinite(position(p,state.axis)));
      if(!plotted.length){card.append(el('p',t('No plottable measurement')));return;}
      const locatedEvents=events.filter(e=>Number.isFinite(position(e,state.axis)));
      const xs=[...plotted.map(p=>position(p,state.axis)),...locatedEvents.map(e=>position(e,state.axis))],ys=plotted.map(p=>p.value);
      // Reference roles stay point-specific, even if multiple local controls differ.
      if(showReferences)for(const p of plotted)for(const ref of p.references)if(ref.value!==null)ys.push(ref.value);

      if(minX===maxX){minX-=1;maxX+=1;}
      const x=v=>70+(v-minX)/(maxX-minX)*730,y=v=>240-(v-low)/(high-low)*190;
      const ticks=[...new Set(xs)].sort((a,b)=>a-b);
      const roundNames=new Map();
      if(state.axis==='round')for(const record of [...plotted,...locatedEvents]){
        const name=record.title?narrative(record.title):record.candidate_id;
        if(!name)continue;
        if(!roundNames.has(record.round))roundNames.set(record.round,new Set());
        roundNames.get(record.round).add(name);
      }
      // Match the SVG text font even when a review panel is currently collapsed.
      // Pack measured horizontal bounds into separate rows, retaining every title.
      const measure=document.createElement('canvas').getContext('2d');
      if(measure)measure.font='12px system-ui';
      const laneEnds=[],labelsByRound=new Map();
      for(const v of ticks){
        let nextLane=0;const labels=[];
        for(const name of roundNames.get(v)||[]){
          const chars=Array.from(name),short=chars.length>10?chars.slice(0,9).join('')+'…':name;
          const text=`R${v} · ${short}`;
          const width=measure?measure.measureText(text).width:Array.from(text).length*12;
          const center=Math.max(8+width/2,Math.min(842-width/2,x(v)));
          let lane=nextLane;
          while((laneEnds[lane]??-Infinity)+12>center-width/2)lane++;
          laneEnds[lane]=center+width/2;nextLane=lane+1;
          labels.push({name,text,center,lane});
        }
        labelsByRound.set(v,labels);
      }
      const eventLanes=new Map(),offsets=new Map();
      for(const event of locatedEvents){
        const at=position(event,state.axis),lane=eventLanes.get(at)||0;
        offsets.set(event,lane*8);eventLanes.set(at,lane+1);
      }
      const eventRows=Math.max(0,...eventLanes.values());
      const labelTop=Math.max(320,280+eventRows*8+20);
      const chartHeight=Math.max(350,labelTop+laneEnds.length*20+30);
      const picture=svg('svg',{viewBox:`0 0 850 ${chartHeight}`,class:'xp-chart',role:'group','aria-label':title});
      picture.append(svg('title',{},title+' · '+t('Absolute measurements')));
      for(let i=0;i<=4;i++){const v=low+(high-low)*i/4;picture.append(svg('line',{x1:70,x2:800,y1:y(v),y2:y(v),stroke:'#2c3b51'}),svg('text',{x:60,y:y(v)+4,'text-anchor':'end'},number(v)));}
      for(const v of ticks){
        const names=roundNames.get(v)||[],full=[`R${v}`,...names].join(' · ');
        const tick=svg('g',{class:'xp-axis-tick','aria-label':state.axis==='round'?full:String(v)});
        tick.append(svg('text',{x:x(v),y:263,'text-anchor':'middle'},state.axis==='timestamp'?new Date(v).toISOString().slice(11,19):state.axis==='round'?`R${v}`:String(v)));
        for(const {name,text,center,lane} of labelsByRound.get(v)){
          const label=svg('text',{x:center,y:labelTop+lane*20,'text-anchor':'middle',class:'xp-axis-name'},text);
          label.append(svg('title',{},name));tick.append(label);
        }
        tick.append(svg('title',{},full));picture.append(tick);
      }
      picture.append(svg('text',{x:430,y:chartHeight-8,'text-anchor':'middle'},t(state.axis==='round'?'Recorded round':state.axis==='order'?'Recorded order':'Recorded time')));
      const groups=new Map();for(const p of points){if(p.series_id){if(!groups.has(p.series_id))groups.set(p.series_id,[]);groups.get(p.series_id).push(p);}}
      const color=p=>p.series_id?colors[[...groups.keys()].indexOf(p.series_id)%colors.length]:'#bac4d5';
      const plottedSet=new Set(plotted),experimentIds=new Set(plotted.map(p=>p.experiment_id));
      const gaps=locatedEvents.filter(e=>e.experiment_ids.length && e.experiment_ids.every(id=>!experimentIds.has(id)))
        .map(e=>position(e,state.axis));
      for(const group of groups.values()){
        const sorted=[...group].filter(p=>Number.isFinite(position(p,state.axis))).sort((a,b)=>position(a,state.axis)-position(b,state.axis));
        // Repeated runs are separate points at the same x. Do not imply their order.
        for(let i=1;i<sorted.length;i++){const a=sorted[i-1],b=sorted[i],ax=position(a,state.axis),bx=position(b,state.axis);
          const repeated=ax===bx || (i>1&&position(sorted[i-2],state.axis)===ax) || (i+1<sorted.length&&position(sorted[i+1],state.axis)===bx);
          if(!repeated&&plottedSet.has(a)&&plottedSet.has(b)&&!gaps.some(v=>v>ax&&v<bx))picture.append(svg('line',{class:'xp-segment',x1:x(ax),x2:x(bx),y1:y(a.value),y2:y(b.value),stroke:color(a),'stroke-width':2}));
        }
      }
      for(const p of plotted){
        for(const ref of showReferences?p.references:[]){if(ref.value===null)continue;const c=ref.role==='frozen_target'?'#70d5b2':ref.role==='external_reference'?'#e1b980':'#abb7ca';
          const n=svg('line',{class:'xp-reference',x1:Math.max(70,x(position(p,state.axis))-35),x2:Math.min(800,x(position(p,state.axis))+35),y1:y(ref.value),y2:y(ref.value),stroke:c,'stroke-dasharray':ref.role==='external_reference'?'2 4':'6 4'});n.append(svg('title',{},t(roleLabel[ref.role])+': '+number(ref.value)+' '+p.unit+' · '+ref.provenance));picture.append(n);
        }
        const label=`${p.title} · ${p.run_id||p.source_record} · ${number(p.value)} ${p.unit} · ${p.statistic} · ${p.verdict} · ${t('Quality')}: ${p.quality}`;
        const circle=svg('circle',{cx:x(position(p,state.axis)),cy:y(p.value),r:6,fill:p.quality==='FAIL'||p.quality==='failed'||p.verdict==='FAIL'?'#ef8bac':color(p),class:'xp-point',tabindex:0,role:'button','aria-label':label});circle.append(svg('title',{},label));bind(circle,p.id);
        circle.addEventListener('mouseenter',()=>{circle.querySelector('title').textContent=label+' · '+[...p.comparison_reasons,...p.plot_reasons].map(t).join('; ');});picture.append(circle);
      }
      picture.append(svg('line',{x1:70,x2:800,y1:296,y2:296,stroke:'#40516b'}),svg('text',{x:60,y:300,'text-anchor':'end'},t('Events')));
      for(const e of locatedEvents){
        const at=position(e,state.axis),offset=offsets.get(e);
        const label=xText(e)+' · '+t(e.category)+' · '+description(e);
        const mark=svg('rect',{x:x(at)-4,y:280+offset,width:8,height:8,rx:2,fill:['failure','failures'].includes(e.category)||['FAIL','failed'].includes(e.quality)||e.state==='failed'?'#ef8bac':'#76b7ff',tabindex:0,role:'button',class:'xp-event-mark','aria-label':label});
        mark.append(svg('title',{},label));bind(mark,e.id);picture.append(mark);
      }
      const scroll=scrollRegion(title+' · '+t('Absolute measurements'));scroll.append(picture);card.append(scroll);
      const legend=el('div',undefined,'xp-legend');for(const [i,key] of [...groups.keys()].entries()){const cfg=groups.get(key)[0].configuration;const label=el('span',[key,cfg.precision,cfg.shape,cfg.hardware].filter(Boolean).join(' · '));label.title=JSON.stringify(cfg);label.style.color=colors[i%colors.length];legend.append(label);}if(points.some(p=>!p.series_id))legend.append(el('span',t('Independent point')));card.append(legend);
      const roles=[...new Set(plotted.flatMap(p=>p.references.filter(r=>r.value!==null).map(r=>r.role)))];
      if(showReferences&&roles.length)card.append(el('p',roles.map(r=>t(roleLabel[r])).join(' · ')+' — '+t('Reference lines apply only to their experiment and configuration.'),'xp-note'));
    }
    function eventList(root,events,title){
      if(!events.length)return;root.append(el('h3',t(title)));const track=el('div',undefined,'xp-events');root.append(track);
      for(const e of events){const button=el('button',`${xText(e)} · ${e.title||''} · ${t(e.category)} · ${description(e)}`,e.category+(['failed','crashed'].includes(e.state)||['FAIL','failed'].includes(e.quality)?' failure':''));button.type='button';bind(button,e.id);track.append(button);}
    }
    function table(root,points,events){
      const more=el('details');more.dataset.xpTable='records';more.append(el('summary',`${t('All records')} · ${points.length} ${t('Measurements')} · ${events.length} ${t('Events')}`));root.append(more);
      const scroll=scrollRegion(t('All records')),table=el('table'),head=el('thead'),row=el('tr');
      for(const label of ['Experiment','Axis','Value','Scope','Statistic','Quality','Evidence verdict','Reason']){
        const cell=el('th',t(label));cell.scope='col';row.append(cell);
      }
      head.append(row);table.append(head);const body=el('tbody');table.append(body);scroll.append(table);more.append(scroll);
      for(const p of points){const tr=el('tr'),cell=el('td'),button=el('button',p.title);button.type='button';bind(button,p.id);cell.append(button);tr.append(cell);
        for(const text of [xText(p),number(p.value)+' '+(p.unit||''),p.scope,p.statistic,t(p.quality),p.verdict,[...p.plot_reasons,...p.comparison_reasons,p.group_note].filter(Boolean).map(t).join('; ')])tr.append(el('td',text||'—'));body.append(tr);}
      for(const e of events){const tr=el('tr'),cell=el('td'),button=el('button',[e.title,t(e.category)].filter(Boolean).join(' · '));button.type='button';bind(button,e.id);cell.append(button);tr.append(cell);
        for(const text of [xText(e),t('No plottable measurement'),'—','—',t(e.quality)||'—',e.verdict||'—',description(e)])tr.append(el('td',text));body.append(tr);}
    }

      roots=targets.filter(Boolean);const {points,events}=projection();const visible=points.filter(shown),ev=events.filter(eventShown).sort((a,b)=>(position(a,state.axis)??Infinity)-(position(b,state.axis)??Infinity));

        const overview=root.hasAttribute('data-review-overview'),inspectOpen=root.querySelector('.xp-inspect')?.open;
        root.replaceChildren();root.classList.add('experiments');root.setAttribute('data-no-translate','');
        if(getData().synthetic)root.append(el('span',t('SYNTHETIC DATA'),'xp-badge'));
        root.append(el('h2',t('Experiment performance')),el('p',t('Absolute measurements')+' · '+t('Missing measurements are never zero-filled. Lines join only compatible recorded configurations.'),'xp-note'));controls(root);
        const axes=new Map();for(const p of visible){if(!axes.has(p.axis_key))axes.set(p.axis_key,[]);axes.get(p.axis_key).push(p);}
        let chartParent=root;
        for(const [index,values] of [...axes.values()].entries()){

            chartParent=el('details',undefined,'xp-other-axes');
            chartParent.dataset.liveKey=chartParent.dataset.key='additional-measurement-axes';
            chartParent.append(el('summary',t('More measurement axes')+' · '+(axes.size-1)));
            chartParent.open=moreAxesOpen;
            chartParent.addEventListener('toggle',()=>{if(chartParent.isConnected)moreAxesOpen=chartParent.open;});
            root.append(chartParent);
          }
          const first=values[0];
          chart(chartParent,values,ev.filter(e=>(!e.workloads.length||e.workloads.includes(first.workload))&&(!e.metrics.length||e.metrics.includes(first.metric))&&e.scopes.includes(first.scope)),!overview);
        }
        if(!visible.length)root.append(el('p',t('No plottable measurement')));
        let inspector=root;
        if(overview){
          inspector=el('details',undefined,'xp-inspect');
          inspector.dataset.key='performance-evidence';inspector.open=Boolean(inspectOpen);
          inspector.append(el('summary',t('Selected evidence and experiment events')));root.append(inspector);
        }
        const detailBox=el('div',undefined,'xp-detail');detailBox.setAttribute('aria-live','polite');
        if(overview)inspector.append(detailBox);
        eventList(inspector,ev.filter(e=>Number.isFinite(position(e,state.axis))),'Event track');
        const unplaced=visible.filter(p=>!Number.isFinite(position(p,state.axis))),unplacedEvents=ev.filter(e=>!Number.isFinite(position(e,state.axis)));
        if(unplaced.length||unplacedEvents.length){const box=el('div',undefined,'xp-unplaced');inspector.append(box);eventList(box,unplacedEvents,'Unpositioned records');for(const p of unplaced){const b=el('button',t('Unpositioned records')+' · '+p.title);b.type='button';bind(b,p.id);box.append(b);}}
        if(!overview)inspector.append(detailBox);
        detail(detailBox);table(inspector,visible,ev);
        if(opened)root.querySelector('[data-xp-table]').open=true;
        if(focus)root.querySelector(`[data-xp-control="${focus}"]`)?.focus();
      }
    }
    return {render,state,select};
  }
  return {create};
})();
</script>

<script>
window.InferRSIKnowledge={create({getData,getLanguage,openRun}){
  const el=(tag,text)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);return n;};
  const tr=(en,zh)=>getLanguage()==='zh'?zh:en;
  const unknown=()=>tr('Not recorded','未记录');
  const words={applied:['Ranking applied','已执行排序'],explicit_ids:['Explicit IDs · caller order','显式 ID · 调用者顺序'],not_requested:['Not requested','未请求'],performed:['Performed','已执行'],unknown:['Unknown','未知'],not_recorded:['Not recorded','未记录'],recorded:['Recorded','已记录'],linked:['Linked','已关联'],used:['Used','采用'],rejected:['Rejected','舍弃'],used_and_rejected:['Used and rejected','采用且舍弃'],local_v1:['Local v1 evidence','本地 v1 依据'],archive_reviewed:['Archive-reviewed association','存档 review 关联'],complete:['Complete','完整'],partial:['Partial','部分'],missing:['Missing','缺失'],context_limit:['Context budget','上下文预算'],output_limit:['Output limit','输出限制'],unsupported_context:['Unsupported assembly','不支持装配'],visible:['Visible return recorded','已记录可见返回'],ref_visible:['Reference visible','引用可见']};
  const label=x=>words[x]?tr(...words[x]):x??unknown();
  const json=x=>JSON.stringify(x,null,2);
  let selected=null,round='',initial=true;
  const opened=new Set();
  const navLink=document.getElementById('knowledge-link');
  function openNavigation(){
    const panel=document.querySelector('#knowledge-navigation > details');
    if(!panel || navLink?.hidden)return;
    opened.add('navigation');panel.open=true;
    const summary=panel.querySelector('summary');
    summary.focus({preventScroll:true});summary.scrollIntoView({block:'start'});
  }
  if(navLink){
    navLink.addEventListener('click',event=>{
      if(!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey && location.hash===navLink.hash){
        event.preventDefault();openNavigation();
      }
    });
    window.addEventListener('hashchange',()=>{if(location.hash===navLink.hash)openNavigation();});
  }
  function fold(box,title,key,draw){const d=el('details');if(key==='navigation')d.className='panel';d.dataset.ktKey=key;d.dataset.liveKey='kt:'+key;d.dataset.key='kt:'+key;d.open=opened.has(key);d.append(el('summary',title));d.addEventListener('toggle',()=>{if(!d.isConnected)return;if(d.open)opened.add(key);else opened.delete(key);});box.append(d);draw(d);return d;}
  const p=(box,text,cls)=>{const n=el('p',text);if(cls)n.className=cls;box.append(n);return n;};
  function table(box,headers,rows){const wrap=el('div');wrap.className='kt-scroll';
    wrap.tabIndex=0;wrap.setAttribute('role','region');
    wrap.setAttribute('aria-label',[box.closest('details')?.querySelector('summary')?.textContent,headers[0]].filter(Boolean).join(' · '));
    const t=el('table'),head=el('thead'),hr=el('tr'),body=el('tbody');headers.forEach(h=>{const th=el('th',h);th.scope='col';hr.append(th);});head.append(hr);rows.forEach(cells=>{const row=el('tr');cells.forEach(v=>{const cell=el('td');cell.append(v instanceof Node?v:document.createTextNode(v==null?unknown():String(v)));row.append(cell);});body.append(row);});t.append(head,body);wrap.append(t);box.append(wrap);}
  function button(box,text,callback){const b=el('button',text);b.type='button';b.onclick=callback;box.append(b);return b;}
  function captureById(id){return getData().knowledge_trace?.retrievals?.find(c=>c.context_id===id);}
  function showCapture(id,keepRound=false){
    selected=id;if(!keepRound)round='';
    opened.add('navigation');opened.add('navigation:'+id);render();
    const panel=[...document.querySelectorAll('#knowledge-navigation [data-kt-key]')].find(d=>d.dataset.ktKey==='navigation:'+id);
    if(panel){const summary=panel.querySelector('summary');summary.focus({preventScroll:true});summary.scrollIntoView({block:'start'});}
    else openNavigation();
  }
  function queryText(request){
    const terms=[request?.query,request?.relevance].filter(v=>typeof v==='string'&&v.trim());
    if(terms.length)return [...new Set(terms)].join(' · ');
    return Array.isArray(request?.ids)&&request.ids.length?request.ids.join(', '):null;
  }
  function captureTerms(c){
    const cue=c.trace?.selection?.cue||c.selection?.cue;
    return queryText(c.trace?.request)||queryText(c.request)||(cue?tr('Ranking cue','排序线索')+' · '+cue:null);
  }
  function links(box,entries,scope){
    if(!entries?.length){p(box,tr('No candidate/run association recorded.','未记录候选/运行关联。'),'kt-note');return;}
    for(const link of entries){const row=getData().candidates.find(r=>r.experiment_id && r.experiment_id===link.experiment_id);
      const title=['R'+link.round,link.candidate_id,link.run_id||unknown()].join(' · ');
      if(link.state==='linked' && row){button(box,title,()=>openRun(link));p(box,[row.verdict,row.quality,row.outcome].map(label).join(' · '));fold(box,tr('Changes and result artifacts','改动与结果证据'),scope+':run:'+row.experiment_id,d=>d.append(el('pre',json({changes:row.optimization?.code_locations,artifacts:row.artifacts}))));}

    }
  }
  function trace(box,raw,scope='capture'){

    const root=el('div');root.className='kt-view';box.append(root);
    fold(root,tr('Retrieval path and ranking','检索路径与排序')+' · '+c.context_id,scope+':'+c.context_id,b=>{
      p(b,captureTerms(c)||tr('No search terms recorded.','未记录检索词。'),'kt-query');
      if(c.purpose)p(b,c.purpose);
      p(b,(o.calls?.length?o.calls.join(' → '):tr('Entry point unknown','入口未知')),'kt-path');
      p(b,[label(selection.state),selection.method,selection.scope,selection.ranking_applied===true?tr('ranking_applied=true','ranking_applied=true'):selection.ranking_applied===false?'ranking_applied=false':tr('Ranking execution unknown','排序执行情况未知')].filter(Boolean).join(' · '));
      const counts=o.counts||{};
      table(b,[tr('Matched','匹配'),tr('Returned','返回选中'),tr('Assembly stage','正文装配阶段'),tr('Assembled groups','已装配组数')],[[counts.matched,counts.returned??c.items?.length,label(o.assembly),o.assembly==='performed'?c.contexts?.length:null]]);
      p(b,tr('Prepared context does not prove delivery or use. Associations do not establish performance causation.','准备上下文不证明模型已收到或使用。关联不证明性能收益的因果关系。'),'kt-note');
      if(!c.used_refs?.length)p(b,tr('used_refs: use not recorded in this field; other search evidence is shown separately.','used_refs：此字段未记录使用；其他搜索依据单独展示。'),'kt-note');
      const scores=new Map((o.items||[]).map(x=>[x.ref,x]));
      const loaded=new Set((c.contexts||[]).filter(x=>x.resources?.length).map(x=>x.ref));
      const omitted=new Map((c.context_omissions||[]).map(x=>[x.ref,x.reason]));
      if(c.used_refs?.some(ref=>omitted.has(ref)))p(b,tr('A declared use names text omitted from this capture. Check its separate evidence.','声明采用的条目包含本快照省略的正文，请核对其独立依据。'),'kt-warning');
      table(b,[tr('Order','顺序'),tr('Knowledge / version','知识 / 版本'),tr('Score','分数'),tr('Assembly','正文装配'),tr('Caller declaration','调用者声明')],(c.items||[]).map((item,i)=>{
        const detail=el('div');detail.append(el('strong',item.title||item.ref));
        if(item.title && item.title!==item.ref)p(detail,item.ref);
        p(detail,item.revision||unknown());
        fold(detail,tr('Resources, sources and score components','资源、来源与分数组成'),scope+':item:'+c.context_id+':'+item.ref,d=>{
          d.append(el('pre',json({title:item.title,authority:item.authority,entrypoint:item.entrypoint,sources:item.sources,skill_documents:item.skill_documents,score:scores.get(item.ref)??null,assembled:(c.contexts||[]).find(x=>x.ref===item.ref)})));
        });
        const rejection=c.rejected_refs?.find(r=>r.ref===item.ref);
        const use=c.used_refs?.includes(item.ref)?tr('Reported used','声明采用'):rejection?[tr('Reported rejected','声明舍弃'),rejection.reason].filter(Boolean).join(' · '):unknown();
        return [i+1,detail,scores.get(item.ref)?.score,o.assembly==='not_requested'?label('not_requested'):loaded.has(item.ref)?tr('Assembled','已装配'):label(omitted.get(item.ref)||'unknown'),use];
      }));
      for(const note of c.takeaways||[])p(b,note);
      if(c.assembled_text){
        const title=tr('Captured context text','当次检索装配的正文');
        fold(b,title,scope+':text:'+c.context_id,d=>{
          p(d,[c.path,c.expected_sha256&&'SHA-256 '+c.expected_sha256].filter(Boolean).join(' · '),'kt-note');
          const pre=el('pre');d.append(pre);
          const fill=()=>{if(d.open){pre.textContent=c.assembled_text;d.removeEventListener('toggle',fill);}};
          d.addEventListener('toggle',fill);fill();
        });
      }
      fold(b,tr('Request, filters, limits and tie rule','请求、过滤、预算与并列规则'),scope+':request:'+c.context_id,d=>d.append(el('pre',json({request,implementation:o.implementation,selection,counts,context_budget:c.context_budget,context_bytes_used:c.context_bytes_used,omissions:c.omissions,context_omissions:c.context_omissions,candidate_details:o.candidate_details}))));
      if(c.display_redacted)p(b,tr('Display redacted; hashes identify the original capture bytes. Review the full bundle before sharing.','展示已脱敏；哈希标识原始快照字节。分享前请审核完整文件。'),'kt-note');
      links(b,c.links,scope+':'+c.context_id);
    });
  }
  function search(box,s){
    fold(box,'R'+s.round+' · v'+s.schema_version+' · '+label(s.coverage||s.state),s.path,b=>{
      p(b,s.path+' · SHA-256 '+(s.sha256||unknown()));
      if(s.state!=='recorded'){p(b,label(s.state),'kt-warning');return;}
      p(b,s.schema_version===1?tr('Local v1: retained legacy use semantics; not archive-reviewed evidence.','本地 v1：保留旧版使用口径，不属于存档 review 关联。'):tr('Portable v2: declarations and archive-reviewed associations are separate.','可移植 v2：声明与存档 review 关联分开展示。'),'kt-note');
      p(b,tr('v1 and v2 are alternative records of this round; counts are not added.','v1/v2 是同轮的不同记录，计数不相加。'),'kt-note');
      table(b,[tr('Coverage','覆盖'),tr('Counts','完整计数'),tr('Observed in supplied records','所提供记录中的观测')],[[label(s.coverage),s.counts==null?unknown():json(s.counts),json(s.observed)]]);
      for(const issue of s.issues||[])p(b,label(issue),'kt-warning');
      for(const id of s.context_ids||[])button(b,tr('Open retrieval · ','打开检索 · ')+id,()=>showCapture(id));
      table(b,[tr('Material','条目'),tr('Recorded use','记录的采用状态'),tr('Evidence / declaration','依据 / 声明')],(s.materials||[]).map(m=>{
        const d=el('div');
        for(const e of m.evidence||[])fold(d,label(e.state),s.path+':evidence:'+m.ref+':'+json(e),node=>node.append(el('pre',json(e))));
        if(m.declarations?.length)d.append(el('pre',json(m.declarations)));
        if(m.conflicts?.length)d.append(el('pre',json(m.conflicts)));
        return [m.ref,label(m.use),d];
      }));
      fold(b,tr('Caller declarations','调用者声明'),s.path+':declarations',d=>d.append(el('pre',json(s.declarations??[]))));
      fold(b,tr('Searches, reads, delivery and source versions','搜索、读取、返回及来源版本'),s.path+':events',d=>{
        for(const [i,e] of (s.events||[]).entries()){
          const action=e.action==='search'?tr('Search','检索'):e.action==='read'?tr('Read','读取'):label(e.action);
          const title=[action,e.tool,e.context_id||e.id].filter(Boolean).join(' · ');
          fold(d,title,s.path+':operation:'+i,entry=>{
            const query=e.query||queryText(e.request);if(query)p(entry,query,'kt-query');
            if(Array.isArray(e.scope)&&e.scope.length)p(entry,tr('Scope','检索范围')+' · '+e.scope.join(', '));
            if(e.materials.length)table(entry,[tr('Recorded material','记录条目'),tr('Revision','版本')],e.materials.map(m=>[m.ref,m.revision]));
            else p(entry,tr('No material recorded for this operation.','此次操作未记录知识条目。'));
            if(e.delivery)p(entry,tr('Delivery','返回状态')+' · '+label(e.delivery.state));
            fold(entry,tr('Event evidence','事件证据'),s.path+':operation-evidence:'+i,node=>node.append(el('pre',json(e))));
          });
        }
        if(s.corpus||s.unresolved_details?.length)d.append(el('pre',json({corpus:s.corpus,unresolved_details:s.unresolved_details})));
      });
      links(b,s.links,s.path);
    });
  }
  function render(){
    const root=document.getElementById('knowledge-navigation');if(!root)return;
    root.replaceChildren();root.classList.add('kt-view');root.setAttribute('data-no-translate','');
    const data=getData().knowledge_trace||{}, captures=data.retrievals||[],searches=data.searches||[];
    const title=tr('Knowledge trace','知识检索 Trace');
    if(navLink){navLink.textContent=title;navLink.hidden=!captures.length&&!searches.length;}
    fold(root,title,'navigation',box=>{
      const rounds=[...new Set([...searches.map(s=>s.round),...captures.flatMap(c=>(c.links||[]).map(l=>l.round))])].sort((a,b)=>a-b);
      if(round && !rounds.includes(Number(round)))round='';
      const control=el('select');control.setAttribute('aria-label',tr('Knowledge round','知识轮次'));control.append(new Option(tr('All rounds','全部轮次'),''));rounds.forEach(n=>control.append(new Option('R'+n,String(n))));control.value=round;control.onchange=()=>{round=control.value;selected=null;render();};box.append(control);
      const visible=captures.filter(c=>!round || c.links?.some(l=>l.round===Number(round)) || searches.some(s=>s.round===Number(round) && s.context_ids?.includes(c.context_id)));
      if(selected && !visible.some(c=>c.context_id===selected)){p(box,tr('Selection no longer available','所选记录已不可用'),'kt-warning');selected=null;}
      if(!visible.length)p(box,tr('No retrieval capture recorded.','未记录检索快照。'));
      const cards=el('div');cards.className='kt-captures';box.append(cards);
      for(const c of visible){
        const card=el('article');card.className='kt-capture';cards.append(card);
        const rounds=[...new Set((c.links||[]).map(l=>l.round).filter(Number.isInteger))];
        const metadata=[...rounds.map(n=>'R'+n),c.captured_at].filter(Boolean);
        if(metadata.length)p(card,metadata.join(' · '),'kt-note');
        button(card,c.context_id,()=>showCapture(c.context_id,true)).setAttribute('aria-pressed',String(selected===c.context_id));
        const query=captureTerms(c);if(query)p(card,query);
        p(card,c.state==='verified'?tr('Returned items','返回条目')+' · '+c.items.length:label(c.state),'kt-note');
      }
      for(const c of visible.filter(c=>!selected || c.context_id===selected)){
        if(c.state!=='verified')p(box,c.context_id+' · '+label(c.state),'kt-warning');
        else trace(box,c,'navigation');
      }
      const filtered=searches.filter(s=>!round||s.round===Number(round));
      if(!filtered.length)p(box,tr('Shared round search record not recorded.','未记录共享逐轮搜索记录。'),'kt-note');
      filtered.forEach(s=>search(box,s));
    });
    if(initial){
      initial=false;
      if(navLink && location.hash===navLink.hash){
        openNavigation();
        window.addEventListener('load',()=>requestAnimationFrame(()=>{
          if(location.hash===navLink.hash && document.activeElement===document.body)openNavigation();
        }),{once:true});
      }
    }
  }
  function backLinks(box,row){
    if(!row)return;const all=getData().knowledge_trace||{};
    const captures=(all.retrievals||[]).filter(c=>c.links?.some(l=>l.state==='linked' && l.experiment_id===row.experiment_id));
    const searches=(all.searches||[]).filter(s=>s.links?.some(l=>l.state==='linked' && l.experiment_id===row.experiment_id));
    const section=el('div');section.className='kt-view';section.setAttribute('data-no-translate','');box.append(section);
    p(section,tr('Knowledge associated with this run','本次运行关联的知识')+' · R'+row.round+' · '+row.candidate_id+' · '+(row.run_id||unknown()));
    if(!captures.length && !searches.length)p(section,tr('No explicit knowledge association recorded.','未记录明确的知识关联。'),'kt-note');
    captures.forEach(c=>button(section,tr('Open retrieval · ','打开检索 · ')+c.context_id,()=>showCapture(c.context_id)));
    searches.forEach(s=>button(section,'R'+s.round+' · v'+s.schema_version,()=>{round=String(s.round);selected=null;opened.add('navigation');opened.add(s.path);render();const d=document.querySelector('#knowledge-navigation > details');d.open=true;d.querySelector('summary').focus();d.scrollIntoView({block:'start'});}));
  }
  return {render,trace,backLinks,openCapture:showCapture,openRun};
}};
</script>

.rd-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}.rd-view select,.rd-view button{max-width:100%;font:inherit;color:var(--text,#edf3f8);background:var(--panel2,#172533);border:1px solid var(--line,#425368);border-radius:5px;padding:6px 10px}

.rd-view :focus-visible{outline:3px solid #69e5cd;outline-offset:3px}.rd-view pre{white-space:pre-wrap;overflow:auto;max-height:22rem;font-size:12px}.rd-view summary{cursor:pointer;margin:8px 0}
.rd-badge{display:inline-block;padding:2px 7px;border:1px solid currentColor;border-radius:4px;font-size:12px;margin-right:6px}.rd-number{color:var(--green,#69e5cd);margin-right:8px}
@container(min-width:1050px){.rd-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

@media(max-width:620px){.rd-view{padding:12px}}

<script>
window.InferRSIRoundDecisions={create({getData,getLanguage,narrative,openCapture,openRun}){
  const tr=(en,zh)=>getLanguage()==='zh'?zh:en;
  const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n;};
  const unknown=()=>tr('Not recorded','未记录');
  const raw=value=>value==null||value===''||value==='Not recorded'?unknown():String(value);
  const text=value=>narrative(raw(value));
  const p=(box,value,cls)=>{const n=el('p',value,cls);box.append(n);return n;};
  const field=(box,name,value,authored=false)=>p(box,name+' · '+(authored?text(value):raw(value)));
  const validRound=n=>Number.isInteger(n)&&n>0;
  const identity=r=>JSON.stringify(r.experiment_id?['experiment',r.experiment_id]:[r.round,r.candidate_id,r.run_id]);
  const words={adopted:['Adopted','采纳'],rejected:['Rejected','拒绝'],rolled_back:['Rolled back','回滚'],pending:['Pending','待定'],no_gain:['No gain','无收益'],noise:['Noise','噪声范围'],not_recorded:['Not recorded','未记录'],passed:['Passed','通过'],failed:['Failed','失败'],complete:['Complete','完整'],partial:['Partial','部分'],missing:['Missing','缺失'],tried:['Tried in campaign','Campaign 中已尝试'],untried:['Untried in campaign','Campaign 中未尝试'],pruned:['Pruned in campaign','Campaign 中已排除']};
  const label=value=>words[value]?tr(...words[value]):raw(value);
  let selected=null;
  const expanded=new Set();
  function button(box,title,key,action){const b=el('button',title);b.type='button';b.dataset.rdFocus=key;b.onclick=action;box.append(b);return b;}
  function detail(box,title,key,draw){
    const d=el('details'),s=el('summary',title),body=el('div');s.dataset.rdFocus=key;d.append(s,body);box.append(d);
    let built=false;const fill=()=>{if(d.open&&!built){built=true;draw(body);}};
    d.addEventListener('toggle',()=>{if(!d.isConnected)return;if(d.open)expanded.add(key);else expanded.delete(key);fill();});
    if(expanded.has(key)){d.open=true;fill();}return d;
  }
  function item(box,title){const a=el('article',null,'rd-item');a.append(el('h4',title));box.append(a);return a;}
  function stage(grid,index,en,zh){const section=el('section',null,'rd-stage');section.dataset.rdStage=String(index);const h=el('h3');h.append(el('span',String(index).padStart(2,'0'),'rd-number'),document.createTextNode(' '+tr(en,zh)));section.append(h);grid.append(section);return section;}
  function render(){
    const root=document.getElementById('round-decisions');if(!root)return;
    const focus=root.contains(document.activeElement)?document.activeElement.dataset.rdFocus:null;
    root.replaceChildren();root.className='rd-view';root.setAttribute('data-no-translate','');
    const title=tr('Round decisions','逐轮决策');root.setAttribute('aria-label',title);
    const heading=document.getElementById('round-decision-title');if(heading)heading.textContent=title;else root.append(el('h2',title));
    p(root,tr('Retrieval results → Alternatives → Final selection → Execution results','检索结果 → 备选方案 → 最终选择 → 执行结果'),'rd-note');
    const data=getData(),rows=data.candidates||[],story=data.story||{},knowledge=data.knowledge_trace||{};
    const iterations=story.iterations||[],searches=knowledge.searches||[],captures=knowledge.retrievals||[];
    const numbers=[...new Set([...rows.map(r=>r.round),...iterations.map(i=>i.round),...searches.map(s=>s.round)].filter(validRound))].sort((a,b)=>a-b);
    const choices=numbers.map(String);if(rows.some(r=>!validRound(r.round)))choices.push('unassigned');
    if(!choices.length)choices.push('unassigned');
    if(!choices.includes(selected))selected=choices[0];
    const toolbar=el('div',null,'rd-toolbar'),control=el('select'),controlLabel=el('label',tr('Round','轮次'));
    control.id='decision-round';control.dataset.rdFocus='round';controlLabel.htmlFor=control.id;
    choices.forEach(value=>control.append(new Option(value==='unassigned'?tr('Round not recorded','轮次未记录'):tr('Round '+value,'第 '+value+' 轮'),value)));
    control.value=selected;control.onchange=()=>{selected=control.value;render();};toolbar.append(controlLabel,control);root.append(toolbar);
    if(data.synthetic)p(toolbar,tr('SYNTHETIC DATA','示意数据'),'rd-warning');
    const number=selected==='unassigned'?null:Number(selected),inRound=r=>number===null?!validRound(r.round):r.round===number;
    const roundRows=rows.filter(inRound),roundIterations=iterations.filter(i=>i.round===number),roundSearches=searches.filter(s=>s.round===number);
    if(number===null)p(root,tr('These records have no recorded round. Their order does not establish a first round.','这些记录没有轮次信息，列表顺序不代表第一轮。'),'rd-warning');
    p(root,tr('Recorded associations only. Selecting an experiment is separate from adopting its measured result.','仅展示已记录的关联；选中尝试与验证后采纳是两个决定。'),'rd-note');
    const grid=el('div',null,'rd-grid');root.append(grid);
    const retrieved=stage(grid,1,'Retrieval results','检索结果'),alternatives=stage(grid,2,'Alternatives','备选方案'),selection=stage(grid,3,'Final selection','最终选择'),results=stage(grid,4,'Execution results','执行结果');
    const contextIds=new Set(roundIterations.flatMap(i=>i.context_ids||[]));
    roundSearches.filter(s=>s.state==='recorded').forEach(s=>(s.context_ids||[]).forEach(id=>contextIds.add(id)));
    captures.filter(c=>number!==null&&c.links?.some(l=>l.round===number)).forEach(c=>contextIds.add(c.context_id));
    if(!contextIds.size)p(retrieved,tr('No retrieval snapshot linked to this round. This does not mean no search occurred.','本轮未关联检索快照，不代表没有发生检索。'),'rd-note');
    for(const id of contextIds){
      const c=captures.find(c=>c.context_id===id),box=item(retrieved,id);
      if(!c||c.state!=='verified'){p(box,label(c?.state),'rd-warning');continue;}
      if(c.association_state)p(box,c.association_state,'rd-warning');
      const request=c.trace?.request||c.request||{};
      field(box,tr('Query','查询'),[request.query,request.relevance].filter(Boolean).join(' · ')||c.selection?.cue);
      p(box,tr('Returned items','返回条目')+' · '+(c.items||[]).length);
      const list=el('ul');box.append(list);
      for(const entry of c.items||[]){
        const li=el('li');li.append(el('strong',raw(entry.title||entry.ref)));p(li,entry.ref,'rd-note');
        detail(li,tr('Version','版本'),'version:'+id+':'+entry.ref,b=>p(b,raw(entry.revision),'rd-note'));
        const loaded=c.contexts?.some(x=>x.ref===entry.ref&&x.resources?.length),omitted=c.context_omissions?.find(x=>x.ref===entry.ref);
        p(li,loaded?tr('Context assembled','正文已装配'):omitted?tr('Context omitted','正文被省略')+' · '+omitted.reason:tr('Assembly not recorded / not requested','正文装配未记录或未请求'),'rd-note');
        const rejection=c.rejected_refs?.find(r=>r.ref===entry.ref),used=c.used_refs?.includes(entry.ref);
        p(li,rejection?(used?tr('Caller declared both use and rejection','调用者同时声明采用和排除'):tr('Caller declared rejection','调用者声明排除'))+' · '+text(rejection.reason):used?tr('Caller declared use (not proof of consumption)','调用者声明采用（不证明实际读取）'):tr('Use not recorded','采用情况未记录'),used&&rejection?'rd-warning':'rd-note');
        list.append(li);
      }
      button(box,tr('Open retrieval evidence','查看检索证据'),'capture:'+id,()=>openCapture(id));
    }
    for(const search of roundSearches){
      const box=item(retrieved,search.path);field(box,tr('Coverage / state','覆盖 / 状态'),label(search.coverage||search.state));
      if(search.issues?.length)p(box,search.issues.join(' · '),'rd-warning');
      // File-search material can exist without a capture. Retain its own versioned evidence.
      detail(box,tr('Search materials and use evidence','搜索材料及采用依据'),'search:'+search.path,b=>{
        for(const m of search.materials||[]){const n=item(b,m.ref);field(n,tr('Recorded use','记录的采用'),label(m.use));n.append(el('pre',JSON.stringify({evidence:m.evidence,declarations:m.declarations,conflicts:m.conflicts},null,2)));}
        if(!search.materials?.length)p(b,unknown());
      });
    }
    for(const row of roundRows){
      const context=row.optimization_trace?.context;if(!context)continue;
      detail(retrieved,tr('Caller-recorded context','调用者记录的上下文')+' · '+row.candidate_id,'context:'+identity(row),box=>{
        p(box,tr('A declaration, not a retained retrieval result snapshot.','调用者声明，不等同于留存的检索结果快照。'),'rd-note');
        field(box,tr('Coverage','覆盖'),label(context.state));
        for(const query of context.queries||[])field(box,tr('Query','查询'),query);
        for(const source of context.sources||[])p(box,[source.ref,source.revision,source.locator].filter(Boolean).join(' · '));
        p(box,text(context.missing_reason||context.text),'rd-note');
      });
    }
    const options=(story.search_space?.dimensions||[]).flatMap(d=>d.options||[]);
    let roundOptions=0,hasRoundSpace=false;
    for(const row of roundRows){
      const trace=row.optimization_trace,space=trace?.search_space;if(!space)continue;
      hasRoundSpace=true;
      const box=item(alternatives,[row.candidate_id,row.run_id].filter(Boolean).join(' · '));
      field(box,tr('Alternative record coverage','备选记录完整性'),label(space.state));
      if(space.missing_reason)p(box,text(space.missing_reason),'rd-note');
      for(const option of space.items||[]){const o=item(box,option.id);p(o,text(option.description));roundOptions++;}
      for(const rule of space.selection_rules||[])p(box,text(rule),'rd-note');
    }
    const linkedOptions=new Set(roundIterations.flatMap(i=>i.candidates.flatMap(c=>c.option_ids||[])));
    for(const id of linkedOptions){
      const option=options.find(o=>o.qualified_id===id),box=item(alternatives,id);roundOptions++;
      p(box,text(option?.description));p(box,tr('Linked by this round’s candidate declaration','本轮候选声明引用的方案'),'rd-note');
      if(option?.source_refs?.length)field(box,tr('Knowledge references','知识引用'),option.source_refs.join(' · '));
    }
    if(!roundOptions)p(alternatives,tr('No round-specific alternatives recorded.','本轮备选方案未记录。'),'rd-note');
    else if(!hasRoundSpace)p(alternatives,tr('Only linked choices are recorded; other alternatives are unknown.','仅记录了候选引用的方案，其他备选方案未知。'),'rd-note');
    if(options.length)detail(alternatives,tr('Campaign search space (not a round shortlist)','Campaign 搜索空间（非本轮备选清单）'),'campaign-options',box=>{
      for(const option of options){const o=item(box,option.qualified_id);p(o,text(option.description));field(o,tr('Campaign status','Campaign 状态'),label(option.status));field(o,tr('Reason','理由'),option.reason,true);if(option.source_refs?.length)field(o,tr('Knowledge references','知识引用'),option.source_refs.join(' · '));}
    });
    p(selection,tr('Selected to try; not post-validation adoption.','本轮选中尝试，不代表验证后采纳。'),'rd-note');
    let selections=0;
    for(const it of roundIterations){
      field(selection,tr('Hypothesis','假设'),it.hypothesis,true);
      for(const candidate of it.candidates){
        const box=item(selection,candidate.candidate_id);selections++;
        p(box,tr('Caller-declared candidate selection','调用者记录的候选选择'),'rd-note');
        field(box,tr('Selected options','选中方案'),candidate.option_ids?.join(' · '));
        field(box,tr('Why this candidate','选择理由'),candidate.why,true);
        field(box,tr('Round rationale','本轮依据'),it.rationale,true);
        field(box,tr('Knowledge references','知识引用'),it.knowledge_refs?.join(' · '));
      }
    }
    for(const row of roundRows){
      for(const step of row.optimization_trace?.steps?.items||[]){
        if(step.kind!=='attempt')continue;
        const box=item(selection,[row.candidate_id,row.run_id,step.search_id].filter(Boolean).join(' · '));selections++;
        p(box,tr('Caller-recorded attempt','调用者记录的尝试'),'rd-note');p(box,text(step.action));field(box,tr('Motivation','动机'),step.motivation,true);
      }
    }
    if(!selections){
      p(selection,tr('Choice and selection rationale not recorded.','选中方案及选择理由未记录。'),'rd-note');
      for(const row of roundRows){const box=item(selection,row.candidate_id);p(box,tr('Registered candidate; registration alone is not selection evidence.','已登记候选；登记本身不证明选择依据。'),'rd-note');field(box,tr('Submitted hypothesis','提交的假设'),row.optimization?.hypothesis,true);}
    }
    if(!roundRows.length)p(results,tr('No candidate execution linked to this round.','本轮未关联候选执行记录。'),'rd-note');
    for(const row of roundRows){
      const key=identity(row),box=item(results,[row.candidate_id,row.run_id||unknown()].join(' · '));
      p(box,label(row.verdict),'rd-badge');field(box,tr('Quality','质量'),label(row.quality));
      const metric=v=>Number.isFinite(v)?String(v)+' '+(row.metric_unit||''):'—';

      field(box,tr('Recorded improvement','记录的改进幅度'),Number.isFinite(row.improvement_pct)?row.improvement_pct+'%':null);
      field(box,tr('Post-validation decision (record)','验证后决定（记录）'),label(row.decision));
      const matches=rows.filter(r=>identity(r)===key);
      if(matches.length===1)button(box,tr('Open run evidence','查看执行证据'),'run:'+key,()=>openRun(row));
      else p(box,tr('Ambiguous candidate/run identity','候选/运行身份不唯一'),'rd-warning');
      detail(box,tr('Changes and evidence references','改动与证据引用'),'artifacts:'+key,b=>b.append(el('pre',JSON.stringify({changes:row.optimization?.code_locations,artifacts:row.artifacts},null,2))));
    }
    for(const it of roundIterations){
      const d=it.decision||{},box=item(results,tr('Post-validation decision (caller)','验证后决定（调用者）'));
      field(box,tr('Candidate','候选'),d.candidate_id);field(box,tr('Decision','决定'),label(d.outcome));field(box,tr('Reason','理由'),d.reason,true);
      const records=roundRows.filter(r=>r.candidate_id===d.candidate_id&&r.decision&&r.decision!=='not_recorded');
      if(records.some(r=>r.decision!==d.outcome))p(box,tr('Decision conflicts with the run record; inspect both sources.','决定与运行记录冲突，请核对两份来源。'),'rd-warning');
    }
    const checks=(story.checks||[]).filter(c=>c.where==='round '+number);
    for(const check of checks)p(root,text(check.message),'rd-warning');
    if(focus){const target=[...root.querySelectorAll('[data-rd-focus]')].find(n=>n.dataset.rdFocus===focus);(target||control).focus({preventScroll:true});}
  }
  return {render};
}};

  const item=document.createElement(tag);

}
const p=(parent,text,cls)=>parent.append(el('p',text,cls));
function metric(dl,label,value){
  const pair=el('div');pair.append(el('dt',label),el('dd',value));dl.append(pair);
}
function table(parent,headers,rows){
  const t=el('table'), head=t.createTHead().insertRow();
  for(const label of headers){const th=el('th',label);th.scope='col';head.append(th);}
  const body=t.createTBody();
  for(const values of rows){const row=body.insertRow();for(const value of values)row.insertCell().textContent=value;}

}

  const f=el('details');f.dataset.key=key;f.append(el('summary',label));
  const content=el('div');f.append(content);parent.append(f);
  let built=false;

  if(opened.has(key)){f.open=true;fill();}

function fullTimeline(raw){
  const records=Array.isArray(raw)?raw:raw?.traceEvents;
  if(!Array.isArray(records)||records.length>2000000)throw Error(tr('格式不符或超过 200 万条记录。','Unsupported format or more than two million records.'));
  let start=Infinity,end=-Infinity,count=0;

    if(e?.ph!=='X'||!Number.isFinite(e.ts)||!Number.isFinite(e.dur)||e.dur<=0||!Number.isFinite(e.ts+e.dur))continue;
    const kind=traceCategory(String(e.cat||'')),name=kind.toUpperCase()+' '+e.pid+':'+e.tid;
    if(!lanes.has(name)){
      if(lanes.size>=512)throw Error(tr('轨道超过 512 条，请在 Perfetto 中打开。','More than 512 tracks. Open with Perfetto.'));
      lanes.set(name,{name,kind,events:[],bins:new Array(256).fill(0)});
    }
    lanes.get(name).events.push({name:String(e.name??''),ts_us:e.ts,dur_us:e.dur});

function compactTimeline(raw){

     !Array.isArray(raw.events)||raw.events.length>2000000)throw Error(tr('事件表格式或大小不受支持。','Unsupported event table format or size.'));
  const tracks=raw.lanes.map(lane=>{
    if(!['cpu','gpu','stage'].includes(lane?.kind)||typeof lane.name!=='string')throw Error(tr('轨道无效。','Invalid track.'));
    return {...lane,events:[],bins:new Array(256).fill(0)};
  });

  for(const record of raw.events){
    if(!Array.isArray(record)||record.length!==4)throw Error(tr('事件记录无效。','Invalid event record.'));
    const [lane,name,ts,dur]=record;
    if(!Number.isInteger(lane)||!tracks[lane]||!Number.isInteger(name)||typeof raw.names[name]!=='string'||
       !Number.isFinite(ts)||!Number.isFinite(dur)||dur<=0||!Number.isFinite(ts+dur))throw Error(tr('事件记录无效。','Invalid event record.'));

  const duration=end-start;
  for(const track of tracks){
    const diff=new Int32Array(257);

      const first=Math.max(0,Math.min(255,Math.floor(256*(e.ts_us-start)/duration)));
      const last=Math.max(first+1,Math.min(256,Math.ceil(256*(e.ts_us+e.dur_us-start)/duration)));
      diff[first]++;diff[last]--;
    }

  }

async function readTraceStream(stream,compact){

      chunks.push(value);
    }

  const raw=JSON.parse(await new Blob(chunks).text());

async function readTraceFile(file,sha,eventsSha){

  const isTable=typeof eventsSha==='string' && hash===eventsSha.toLowerCase();
  if(!isTable && hash!==sha.toLowerCase())throw Error(tr('SHA-256 与本次采集不符。','SHA-256 differs from the recorded source.'));
  const signature=new Uint8Array(bytes,0,Math.min(2,bytes.byteLength));
  let stream=new Blob([bytes]).stream();
  if(signature[0]===31&&signature[1]===139)stream=stream.pipeThrough(new DecompressionStream('gzip'));
  return readTraceStream(stream,isTable);
}

  p(goal,recorded(spec.statement)||data.campaign_id,'goal');
  if(spec.metric)p(goal,recorded(spec.metric),'note');
  if(spec.baseline)p(goal,recorded(spec.baseline));
  if(spec.target)p(goal,recorded(spec.target));
  if(spec.constraints?.length){const list=el('ul');for(const c of spec.constraints)list.append(el('li',recorded(c)));goal.append(list);}
  const baseline=rows.find(r=>verifiedProfile(r)?.scope==='baseline_request');
  const profile=baseline&&verifiedProfile(baseline);
  experimentHistory(base,opened);
  const hasStageHistory=stageHistory(base,rows);
  if(profile){
    p(base,tr('已校验的基线 · 采样范围用时','Verified baseline · sampled scope duration')+'  '+fmt(profile.total)+' '+profile.metric_unit,'value');
    profileTable(base,profile);
  }else if(!hasStageHistory)p(base,tr('缺少与本轮证据哈希匹配的请求 profile。','No verified request profile is attached.'),'note');
  if(profile?.conclusion && !(data.profile_captures||[]).some(c=>c.takeaway===profile.conclusion))
    p(gap,recorded(profile.conclusion));
  const step=rows.find(r=>verifiedProfile(r)?.scope==='denoiser_step');
  if(step){const d=verifiedProfile(step);p(gap,rowLabel(step)+' · '+tr('去噪单步 GPU profile','Single denoising step GPU profile'),'value');
    profileTable(gap,d);if(d.conclusion)p(gap,recorded(d.conclusion));}
  const ref=baseline?.baseline_median,unit=baseline?.metric_unit||'',target=data.overview.target_improvement_pct;
  const scoped=Object.hasOwn(data.overview,'profile_best_improvement_pct');
  const gain=scoped?data.overview.profile_best_improvement_pct:data.overview.best_improvement_pct;
  const best=Number.isFinite(gain)?rows.find(r=>r.improvement_pct===gain && r.state==='completed' &&
    (!scoped || r.matches_profile_baseline) &&
    r.quality==='passed' && r.source_verified===true && r.decision!=='rolled_back' && ['PASS','FAIL'].includes(r.verdict)):null;
  const dl=el('dl',null,'metrics');gap.append(dl);
  if(Number.isFinite(ref))metric(dl,tr('配对验收基线','Paired acceptance baseline'),fmt(ref)+' '+unit);
  if(Number.isFinite(ref) && Number.isFinite(target) && ['minimize','maximize'].includes(baseline.direction)){
    const lower=baseline.direction==='minimize';
    metric(dl,tr('目标值','Target value'),fmt(ref*(1+(lower?-target:target)/100))+' '+unit);
  }
  if(best){
    const label=scoped?tr('同基线测量条件的最佳改善','Best improvement under baseline conditions'):tr('最佳实测改善','Best measured improvement');
    metric(dl,label+' · '+rowLabel(best),fmt(best.improvement_pct,2)+'%');
    if(Number.isFinite(target))metric(dl,tr('距目标','Gap to target'),fmt(Math.max(0,target-best.improvement_pct),2)+tr(' 个百分点',' pp'));}
  for(const r of rows){
    const it=iteration(r),trace=r.optimization_trace;
    const outer=el('details',null,'capture-fold'),name=el('summary'),a=el('article',null,'round');
    outer.dataset.key='round:'+JSON.stringify([r.round,r.candidate_id,r.run_id]);outer.open=opened.has(outer.dataset.key);
    name.append(el('span',rowLabel(r),'tag'),document.createTextNode(recorded(r.title||r.candidate_id)));
    outer.append(name,a);rounds.append(outer);
    name.dataset.experimentId=r.experiment_id;name.tabIndex=-1;
    const jump=el('button'),gain=Number.isFinite(r.improvement_pct)?(r.improvement_pct>0?'+':'')+fmt(r.improvement_pct,2)+'%':dash;
    jump.type='button';
    jump.title=tr('查看本轮依据、改动和实测','Open round evidence, changes and results');
    jump.append(el('span',rowLabel(r),'round-number'),el('strong',recorded(r.title||r.candidate_id)),el('span',gain,'round-gain'));
    const paired=Number.isFinite(r.baseline_median)&&Number.isFinite(r.candidate_median);
    const measurement=paired?fmt(r.baseline_median)+' → '+fmt(r.candidate_median)+' '+(r.metric_unit||''):tr('无配对测量','No paired measurement');
    const evidence=[measurement,status(r.outcome),r.verdict];
    if(r.matches_profile_baseline===false)evidence.push(tr('测量条件不同','Different measurement conditions'));
    jump.append(el('small',evidence.filter(Boolean).join(' · ')));roundLinks.append(jump);
    jump.onclick=()=>{rounds.parentElement.open=true;outer.open=true;name.focus();name.scrollIntoView({block:'start'});};
    if(r.optimization?.summary && r.optimization.summary!==r.title)p(a,recorded(r.optimization.summary));
    const skills=trace?.applied_skills||[];
    for(const skill of skills){
      const line=el('p',null,'basis');line.append(el('code',skill.name),' · ',document.createTextNode(recorded(skill.takeaway)));a.append(line);
    }
    if(!skills.length){
      const observation=trace?.steps?.items?.find(s=>s.kind==='observation' && s.result);
      const basis=observation?.result || it?.hypothesis || r.optimization?.hypothesis;
      if(basis && basis!==r.title && basis!=='Not recorded')p(a,recorded(basis),'basis');
    }
    const facts=el('div',null,'facts');a.append(facts);
    if(paired){facts.append(el('span',tr('基线 → 候选','Baseline → candidate')+'  '+fmt(r.baseline_median)+' → '+fmt(r.candidate_median)+' '+(r.metric_unit||'')));}
    if(Number.isFinite(r.improvement_pct))facts.append(el('strong',fmt(r.improvement_pct,2)+'% · '+status(r.outcome)));
    facts.append(el('span',status(r.state)),el('span',tr('质量校验','Quality')+' · '+status(r.quality)));
    details(a,r,it,opened);
    knowledgeView.backLinks(a,r);
    const item=el('div',null,'decision'),decision=it?.decision;
    const confirmed=r.decision && r.decision!=='not_recorded';
    const outcome=confirmed?r.decision:'not_recorded';
    item.append(el('code',rowLabel(r)),el('strong',status(outcome)));
    if(confirmed && decision?.outcome===outcome && (!decision.candidate_id || decision.candidate_id===r.candidate_id))
      item.append(el('span',recorded(decision.reason),'note'));
    decisions.append(item);
  }
  if(!rows.length){p(rounds,tr('尚无轮次记录。','No rounds recorded.'));p(decisions,dash);}
  byId('paired-title').textContent=tr('配对参照 · 相对同轮基线的加速比','Paired reference · speedup against each round’s baseline');
  byId('chart-note').textContent=tr('各点独立比较同轮基线和候选测量值。','Each point compares its candidate with the baseline measured in the same round.');
  byId('paired-reference').hidden=!chart;
  const chartBox=byId('paired-chart');chartBox.innerHTML=chart;
  if(!chart)chartBox.textContent=tr('暂无可比测量。','No comparable measurements.');
  else if(language==='zh'){
    const labels={'Performance by recorded round':'按轮次记录的性能','Speedup index':'加速指数','Speedup vs paired baseline':'相对配对基线的加速比','Recorded round':'已记录轮次','baseline: paired baseline':'基线：配对基线','Baseline':'基线','baseline':'基线','Recorded rounds':'已记录轮次','Target':'目标','noise':'噪声范围内','improved':'改善','regressed':'回退','failed':'失败','rolled back':'已回滚'};
    for(const n of chartBox.querySelectorAll('svg text,svg title')){
      const parts=n.textContent.split(' · ');n.textContent=parts.map(s=>labels[s]||s).join(' · ');
    }
  }
  byId('summary-title').textContent=tr('成功与失败','Successes and failures');
  byId('original-summary-title').textContent=tr('全部原始成功与失败记录','All original successes and failures');
  const summary=data.story?.summary,summaryBox=byId('original-summary-body');summaryBox.replaceChildren();
  if(summary){p(summaryBox,status(summary.state)+' · '+recorded(summary.missing_reason||''));
    for(const [key,zh,en] of [['successes','成功叙述','Successes'],['failures','失败叙述','Failures']]){
      summaryBox.append(el('h3',tr(zh,en)));for(const item of summary[key]){p(summaryBox,recorded(item.text));for(const link of item.links)p(summaryBox,link.ref+' · '+status(link.state),'note');}
    }
    for(const [key,zh,en] of [['lessons','经验','Lessons'],['limitations','限制','Limitations']]){summaryBox.append(el('h3',tr(zh,en)));for(const item of summary[key])p(summaryBox,recorded(item));}
  }
  experimentView.render([byId('chart'),byId('summary-experiments')]);
  knowledgeView.render();roundDecisionView.render();
  if(previousFocus){for(const node of document.querySelectorAll('details'))if(node.dataset.key===previousFocus)node.querySelector('summary').focus({preventScroll:true});}
}
byId('language').addEventListener('click',()=>{
  language=language==='zh'?'en':'zh';try{localStorage.setItem('inferrsi.dashboard.language',language);}catch{}
  render();
});
async function poll(){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
  try{
    const headers={'X-InferRSI-Compact':'1'};if(etag)headers['If-None-Match']=etag;
    const response=await fetch('/api/state',{headers,signal:controller.signal,cache:'no-store'});
    if(response.status!==304){
      if(!response.ok)throw Error('snapshot unavailable');
      const next=await response.json();
      if(next.data.review_layout!=='profile_first'){location.reload();return;}
      data=next.data;chart=next.chart;render();etag=response.headers.get('ETag');
    }
    connected=true;
  }catch{connected=false;}
  finally{clearTimeout(timer);attempted=true;byId('connection').textContent=connected?'Connected':'Disconnected';setTimeout(poll,3000);}
}
// A hash link opens the relevant disclosures once. Subsequent live refreshes
// and language changes retain the reader's own expanded/collapsed choices.
function openEvidenceLink(){
  function reveal(details){
    details.open=true;
    const summary=details.querySelector(':scope > summary');
    summary.focus({preventScroll:true});summary.scrollIntoView({block:'start'});
  }
  if(['#review-goal','#review-decisions','#round-decision-panel'].includes(window.location.hash))reveal(byId(window.location.hash.slice(1)));
  if(window.location.hash==='#trace' && !byId('trace-link').hidden){
    byId('trace').open=true;
    reveal(byId('baseline').querySelector('[data-key="experiment-all"]'));
  }
  if(window.location.hash==='#profiles' && !byId('profiles-link').hidden){
    const panel=byId('profiles');panel.open=true;
    const card=panel.querySelector('.capture-fold[open]')||panel.querySelector('.capture-fold');
    if(!card){reveal(panel);return;}
    const timeline=()=>card.querySelector('details[data-key$="-timeline"]');
    const ready=timeline();
    if(!ready)card.addEventListener('toggle',()=>{if(card.open)reveal(timeline());},{once:true});
    card.open=true;
    if(ready)reveal(ready);
  }
}
for(const link of ['goal-link','profiles-link','trace-link','decisions-link','round-decisions-link'].map(byId)){
  link.addEventListener('click',event=>{
    if(link.hash===window.location.hash && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey){
      event.preventDefault();openEvidenceLink();
    }
  });
}
window.addEventListener('hashchange',openEvidenceLink);
window.addEventListener('load',()=>requestAnimationFrame(openEvidenceLink),{once:true});
render();if(live)poll();
})();
</script>
