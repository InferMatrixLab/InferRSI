name: Campaign acceptance
description: Acceptance-first campaign (baseline vs candidate) — pin SHAs in this issue only
title: "acceptance: <campaign-name>"
labels:
  - acceptance
body:
  - type: markdown
    attributes:
      value: |
        Pattern: acceptance issue **before** feature work. Verdicts: `PASS` / `FAIL` / `INCONCLUSIVE` only.
        Evidence tree: `evidence/<campaign-id>/` with `plan/`, `results/`, `patch/`, `validator/`.
  - type: input
    id: campaign_id
    attributes:
      label: Campaign ID
      description: e.g. my-model / cpu×1
      placeholder: my-scenario / local×1
    validations:
      required: true
  - type: input
    id: baseline_sha
    attributes:
      label: Pinned baseline SHA
      description: Full git SHA for baseline revision
      placeholder: "<baseline-sha>"
    validations:
      required: true
  - type: input
    id: candidate_sha
    attributes:
      label: Pinned candidate SHA
      description: Full git SHA for candidate revision
      placeholder: "<candidate-sha>"
    validations:
      required: true
  - type: textarea
    id: runspec
    attributes:
      label: RunSpec snapshot
      description: repo × revision × backend × device × model × scenario
      value: |
        repo:
        revision: (candidate)
        backend:
        device:
        model:
        scenario:
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Gate checklist (frozen before runs)
      description: Validators, e2e scenarios, numeric bars
      value: |
        - [ ] Validators frozen under evidence/.../validator/
        - [ ] E2E scenario defined (not microbench-only for latency claims)
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: evidence_paths
    attributes:
      label: Evidence paths
      value: |
        plan: evidence/<campaign-id>/plan/
        results: evidence/<campaign-id>/results/
        patch: evidence/<campaign-id>/patch/
        validator: evidence/<campaign-id>/validator/
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      options:
        - INCONCLUSIVE
        - FAIL
        - PASS
      description: Update when evidence is complete
    validations:
      required: true
  - type: textarea
    id: downstream_citation
    attributes:
      label: Downstream citation blurb
      description: Text external PRs should copy (issue link + SHAs + artifact paths)
      placeholder: |
        Acceptance: this issue. Baseline <baseline-sha>, candidate <candidate-sha>.
        Artifacts: evidence/<campaign-id>/results/
