name: CI — draft lane

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: draft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests tools
      - name: Smoke tests
        run: pytest tests/test_smoke.py tests/test_claim.py
