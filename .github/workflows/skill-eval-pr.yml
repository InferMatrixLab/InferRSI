name: Skill PR evaluation
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'execute'
      && format('skill-eval execute PR {0} plan {1}', inputs.pr, inputs.plan_sha256)
      || format('skill-eval plan or publish PR {0}', inputs.pr || github.event.pull_request.number) }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - src/inferrsi/data/skill_library/**
      - tools/skill_eval_*
      - docs/examples/skill-comparison/**
      - .github/workflows/skill-eval-pr.yml
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [execute, publish]
        required: true
        description: Execute consumes authorization once; publish reuses retained results
      pr:
        required: true
        description: PR number
      plan_sha256:
        required: true
        description: Exact PR plan SHA-256 shown by automatic planning
      version:
        required: true
        description: Exact trusted implementation SHA shown in the plan
      base:
        required: true
        description: Exact compared base SHA
      head:
        required: true
        description: Exact compared head SHA
      budget:
        required: true
        description: Explicit approval of the complete Budget JSON shown in the plan
      source_run:
        description: Execution workflow run ID, required for publish-only retries

permissions: {}

# Every writer and execution for a PR is serialized; never cancel paid work.
concurrency:
  group: skill-eval-pr-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PYTHONPATH: src

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[skills]'
      - name: Prepare from trusted code and raw PR Git objects
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.skill_eval_pr prepare --output prepared
      - name: Validate explicit operator authorization and reserve execution
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'execute'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.skill_eval_pr authorize --output prepared
      - uses: actions/upload-artifact@v4
        with:
          name: skill-eval-plan
          path: prepared
          retention-days: 30

  execute:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'execute'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[skills]'
      - uses: actions/download-artifact@v4
        with:
          name: skill-eval-plan
          path: prepared
      - name: Existing client preflight (requires separately provisioned model access)
        run: codex --version
      - name: Recheck live revision and authorization before execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.skill_eval_pr authorize --output prepared
      - name: Execute existing comparison without publication credentials
        run: python -m tools.skill_eval_pr execute --output prepared
      - name: Package retained results even after interruption
        if: always()
        run: python -m tools.skill_eval_pr pack --output prepared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-eval-results
          path: prepared/results.zip
          retention-days: 30

  publish:
    if: always() && needs.plan.result == 'success'
    needs: [plan, execute]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[skills]'
      - name: Rebuild trusted inputs; never execute artifact code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.skill_eval_pr prepare --output prepared
      - name: Update the single revision-bound summary from retained data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.skill_eval_pr publish --output prepared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-eval-report
          path: |
            prepared/pr-plan.json
            prepared/*/report.json
            prepared/*/report.md
          retention-days: 30
