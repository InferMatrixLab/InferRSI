name: CI — knowledge declaration policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  declarations:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    concurrency:
      group: knowledge-policy-status-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evaluate declarations with trusted main code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/run_knowledge_model_policy.sh
