name: CI — knowledge declaration policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  declarations:
    # Keep eligibility identical here and in the group: skipped comments must not
    # replace a pending writer, regardless of GitHub's evaluation order.
    if: >-
      ${{ github.event_name != 'issue_comment' || !github.event.issue ||
          !github.event.comment || !github.event.action ||
          (github.event.issue.pull_request && (github.event.action != 'created' ||
          !github.event.comment.body ||
          contains(github.event.comment.body, 'knowledge-policy-approval'))) }}
    concurrency:
      group: >-
        ${{ (github.event_name != 'issue_comment' || !github.event.issue ||
            !github.event.comment || !github.event.action ||
            (github.event.issue.pull_request && (github.event.action != 'created' ||
            !github.event.comment.body ||
            contains(github.event.comment.body, 'knowledge-policy-approval')))) &&
            'knowledge-policy-status-writer' ||
            format('knowledge-policy-skipped-{0}-{1}', github.run_id, github.run_attempt) }}
      # Preserve the serialized writer without replacing the sole pending merge event.
      # GitHub bounds this queue at 100; overflow can still cancel pending work.
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evaluate declarations with trusted main code
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Temporary owner-approved capture: Python also enforces event/before/head gating.
          ISSUE203_PRIVATE_CAPTURE: one-shot
        run: bash tools/run_knowledge_model_policy.sh

      - name: Retain only encrypted one-shot rejection diagnostic
        if: >-
          ${{ always() && steps.admission.outputs.private_capture == 'encrypted' &&
              github.event_name == 'push' && github.run_attempt == 1 &&
              github.event.before == 'a3970f55ff62b628f85d638708ad9fb28361720a' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue203-encrypted-rejection
          path: ${{ runner.temp }}/issue203-422-errors.cms
          retention-days: 1
          if-no-files-found: ignore
