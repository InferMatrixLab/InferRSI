name: CI — nightly lane

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-main
  cancel-in-progress: false

jobs:
  frozen-bytes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Frozen Git bytes across checkout policies
        run: python -m pytest tests/test_frozen_bytes.py

  safety-net:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Full test suite
        run: pytest
      - name: Read-only evidence inventory and manifest checks
        run: python tools/validate_evidence.py
      - name: Read-only label drift report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/labels" \
            --jq '.[] | {name, description}' > "$RUNNER_TEMP/labels.jsonl"
          python tools/check_labels.py "$RUNNER_TEMP/labels.jsonl"
