name: SkillEval verifier qualification (manual)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: skill-eval-verifier-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install distribution bubblewrap, without changing security policy
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Strict trusted controls (no skip, no model, no submitted code)
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONPATH=src \
            /usr/bin/python3 -m tools.skill_eval_qualify \
            --output "$RUNNER_TEMP/verifier-qualification" \
            --revision "$GITHUB_SHA" --runner-image "${ImageOS:-unknown}/${ImageVersion:-unknown}"
      - name: Retain qualification, including unavailable isolation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verifier-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verifier-qualification/qualification.json
          if-no-files-found: error
          retention-days: 14
