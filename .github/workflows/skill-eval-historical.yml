name: SkillEval fixed historical cloud generation (manual)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: skill-eval-historical-issue253
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == 'Dong1017' && github.triggering_actor == 'Dong1017'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install trusted main dependencies before secret injection
        run: python -m pip install '.[skills]'
      - name: Freeze fixed inputs, protocol and accounting approval before calls
        env:
          PYTHONPATH: src
        run: |
          git -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags \
            https://github.com/InferMatrixLab/InferRSI.git \
            a1ee3266466194c16f4e2159ab845b758ed9561b \
            86f003364804d116b3202c4d807cc898a3a02ade
          python -m tools.skill_eval_historical_job prepare --output "$RUNNER_TEMP/historical"
      - name: Generate two bounded sources through durable admission
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          SKILL_EVAL_YIBUAPI_KEY: ${{ secrets.SKILL_EVAL_YIBUAPI_KEY }}
        run: python -m tools.skill_eval_historical_job execute --output "$RUNNER_TEMP/historical"
      - name: Retain bounded public evidence without secrets or source execution
        if: always()
        shell: bash
        run: |
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONPATH=src \
            python -m tools.skill_eval_historical_job package --output "$RUNNER_TEMP/historical"
      - name: Upload fixed data-only evidence, including partial capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical/public
          if-no-files-found: error
          retention-days: 30
