name: CI — merge lane

on:
  push:
    branches: [main]

concurrency:
  group: merge-main
  cancel-in-progress: false

jobs:
  policy-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold manifest check
        run: |
          test -f docs/repo-template.md
          test -f README.md
          test -d src/rsi_scaffold/harness
          test -d src/rsi_scaffold/model
          test -d src/rsi_scaffold/infra
          test -d evidence/_template/plan
          echo "merge lane: no heavy suite on main push (see ready + nightly lanes)"
