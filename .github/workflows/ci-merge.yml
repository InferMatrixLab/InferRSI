name: CI — merge lane

on:
  push:
    branches: [main]

concurrency:
  group: merge-main
  cancel-in-progress: false

jobs:
  policy-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold manifest check
        run: |
          test -f docs/contributing.md
          test -f README.md
          test -d src/inferrsi/harness
          test -d src/inferrsi/model
          test -d src/inferrsi/infra
          test -d evidence/_template/plan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU smoke dependencies
        run: python -m pip install . pytest
      - name: CPU smoke on every main push
        run: python -m pytest tests/test_smoke.py tests/test_claim.py
