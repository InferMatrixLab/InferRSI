name: CI — ready / review lane

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests benchmarks/harness
      - name: Tests (smoke + unit + bench stub)
        run: pytest
