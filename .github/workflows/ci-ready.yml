name: CI — ready / review lane

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  installed-package:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributables
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Smoke test a clean wheel installation outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "${wheels[0]}[skills]"
          cp tests/check_installed.py "$RUNNER_TEMP/check_installed.py"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH INFERRSI_CHECKOUT_RESOURCES="$GITHUB_WORKSPACE/src/inferrsi" "$RUNNER_TEMP/wheel-env/bin/python" -I check_installed.py

  full-check:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests tools
      - name: Tests (smoke + unit)
        run: pytest -rs

  dashboard-browser:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Test dashboard navigation and live refresh in Chromium
        run: |
          python -m pytest -vv -o addopts='' \
            tests/test_knowledge_navigation_browser.py \
            tests/test_dashboard_experiments_browser.py \
            --junitxml="$RUNNER_TEMP/dashboard-browser-results.xml"
      - name: Retain browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-results
          path: ${{ runner.temp }}/dashboard-browser-results.xml
          retention-days: 30

  pr-references:
    # Reports closing syntax in PR body text at each ready-lane event; not a branch-protection gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject closing syntax inside PR body text
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/check_pr_references.py
