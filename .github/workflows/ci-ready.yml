name: CI — ready / review lane

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  installed-package:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributables
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Smoke test a clean wheel installation outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "${wheels[0]}[skills]"
          cp tests/check_installed.py "$RUNNER_TEMP/check_installed.py"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/wheel-env/bin/python" -I check_installed.py

  full-check:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests tools
      - name: Tests (smoke + unit)
        run: pytest

  kv-task-qualification:
    # Bounded software-control qualification; not a branch-protection or efficacy gate.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install distribution bubblewrap without changing security policy
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Synthetic CPU controls (no model, secret or submitted artifact)
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONPATH=src \
            /usr/bin/python3 -m tools.qualify_kv_reclamation \
            --plan evidence/kv-reclamation-20261030/plan/qualification-plan.json \
            --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/kv-qualification"
      - name: Retain privacy-safe qualification receipt including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kv-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kv-qualification/qualification.json
            ${{ runner.temp }}/kv-qualification/raw-evidence.zip
          if-no-files-found: error
          retention-days: 14
      - name: Scripted actor and descendant qualification (no provider or credentials)
        if: always()
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONPATH=src \
            /usr/bin/python3 -m tools.qualify_kv_edit_actor \
            --plan evidence/kv-actor-qualification-20261030/plan/qualification-plan.json \
            --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/kv-actor-qualification"
      - name: Retain separate scripted actor receipt including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kv-actor-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kv-actor-qualification/qualification.json
            ${{ runner.temp }}/kv-actor-qualification/raw-evidence.zip
          if-no-files-found: error
          retention-days: 14
