[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inferrsi"
version = "0.1.0"
description = "CLI-first reproducible inference experiments and source-grounded tuning knowledge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
inferrsi = "inferrsi.cli:main"

[project.urls]
Repository = "https://github.com/InferMatrixLab/InferRSI"
Issues = "https://github.com/InferMatrixLab/InferRSI/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
inferrsi = ["data/**/*.json", "data/**/*.md", "data/**/LICENSE", "data/**/scripts/*.py"]

[project.optional-dependencies]
skills = ["PyYAML>=6.0"]
dev = ["pytest>=7.4", "ruff>=0.6", "PyYAML>=6.0"]
image = ["numpy>=1.24", "Pillow>=10", "scikit-image>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Immutable historical snapshots retain their original formatting.
extend-exclude = ["tests/fixtures/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I"]
