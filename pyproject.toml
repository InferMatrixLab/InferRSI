[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "inferrsi"
dynamic = ["version"]
description = "CLI-first reproducible inference experiments and source-grounded tuning knowledge"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
inferrsi = "inferrsi.cli:main"

[project.urls]
Repository = "https://github.com/InferMatrixLab/InferRSI"
Issues = "https://github.com/InferMatrixLab/InferRSI/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
inferrsi = ["data/**/*.json", "data/**/*.md", "data/**/LICENSE", "data/**/THIRD_PARTY_NOTICES", "data/**/scripts/*.py", "data/**/references/licenses/*.txt", "data/**/references/upstream-NOTICE", "data/dashboard/*.html", "data/task_input/*.yaml"]

[tool.setuptools_scm]
version_file = "src/inferrsi/_version.py"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[tool.inferrsi.release]
initial_version = "0.1.0"
prerelease = true

[project.optional-dependencies]
# Keep the former extra as an alias for existing installs.
skills = []
dev = ["pytest>=7.4", "ruff>=0.6"]
image = ["numpy>=1.24", "Pillow>=10", "scikit-image>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Immutable historical snapshots retain their original formatting.
extend-exclude = ["tests/fixtures/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I"]
