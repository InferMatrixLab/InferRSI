[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "inferrsi"
dynamic = ["version"]
description = "CLI-first reproducible inference experiments and source-grounded tuning knowledge"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
inferrsi = "inferrsi.apps.cli:main"

[project.urls]
Repository = "https://github.com/InferMatrixLab/InferRSI"
Issues = "https://github.com/InferMatrixLab/InferRSI/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
inferrsi = [
    "apps/views/*.html",
    "apps/cli/task-input/v1/*.json",
    "apps/cli/task-input/v1/*.yaml",
]
"inferrsi.knowledge" = [
    "data/**/*.json",
    "data/**/*.md",
    "data/**/*.txt",
    "data/**/*.py",
    "data/**/LICENSE",
    "data/**/THIRD_PARTY_NOTICES",
    "data/**/upstream-NOTICE",
]
"inferrsi.harness" = ["data/**/*.json"]
"inferrsi.benchmark" = ["tasks/**/*.py", "tasks/**/*.json", "tasks/**/*.md", "tasks/**/*.jsonl", "tasks/**/LICENSE"]

[tool.setuptools_scm]
version_file = "src/inferrsi/_version.py"
# Select release tags before parsing the version. Evidence tags share this history.
git_describe_command = """
git describe --dirty --tags --long --abbrev=40 \
  --match v[0-9]*.[0-9]*.[0-9]* --exclude v*[!0-9.]* --exclude *.*.*.*
"""
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[tool.inferrsi.release]
initial_version = "0.1.0"
prerelease = true

[project.optional-dependencies]
# PyYAML is a core dependency; the skills extra stays as a compatibility alias.
skills = ["PyYAML>=6.0"]
dev = ["pytest>=7.4", "ruff>=0.6", "PyYAML>=6.0", "jsonschema>=4.18"]
image = ["numpy>=1.24", "Pillow>=10", "scikit-image>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Immutable historical snapshots retain their original formatting. The pre-removal session
# is a whole session written by an older runtime; its plan pins the hashes of these files.
extend-exclude = [
    "tests/fixtures/legacy",
    "tests/fixtures/optimization-session/pre-infra-removal-session",
    "tests/fixtures/optimization-session/pre-trials-rename-session",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
