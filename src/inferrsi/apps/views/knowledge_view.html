<style>
.kt-view{margin:14px 0;padding:12px;border:1px solid #59606b;border-radius:8px;overflow-wrap:anywhere;min-width:0}
.kt-view summary,.kt-view button,.kt-view select{cursor:pointer}.kt-view button{margin:4px;padding:5px 9px}
.kt-view button[aria-pressed="true"]{outline:2px solid #6dc1ff}.kt-view pre{white-space:pre-wrap;max-height:24rem;overflow:auto}.kt-scroll{overflow:auto;max-width:100%}
.kt-view table{border-collapse:collapse;width:100%;font-size:13px}.kt-view td,.kt-view th{padding:8px;text-align:left;border-bottom:1px solid #59606b;vertical-align:top}
.kt-view :focus-visible{outline:3px solid #6dc1ff;outline-offset:3px}.kt-note{opacity:.8;font-size:13px}.kt-warning{color:#e8a759}
.kt-captures{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:8px;margin:12px 0}
.kt-capture{min-width:0;padding:10px 12px;border:1px solid var(--line,#425368);border-radius:6px;background:var(--panel2,#172533)}
.kt-capture button{margin:3px 0;color:var(--green,#69e5cd);font:600 14px/1.4 system-ui,sans-serif;overflow-wrap:anywhere;max-width:100%}
.kt-capture p,.kt-view .kt-query{white-space:normal;margin:5px 0;overflow-wrap:anywhere}
.kt-view table td{white-space:normal;vertical-align:top}
</style>
<script>
window.InferRSIKnowledge={create({getData,getLanguage,openRun}){
  const el=(tag,text)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);return n;};
  const tr=(en,zh)=>getLanguage()==='zh'?zh:en;
  const unknown=()=>tr('Not recorded','未记录');
  const words={applied:['Ranking applied','已执行排序'],explicit_ids:['Explicit IDs · caller order','显式 ID · 调用者顺序'],not_requested:['Not requested','未请求'],performed:['Performed','已执行'],unknown:['Unknown','未知'],not_recorded:['Not recorded','未记录'],recorded:['Recorded','已记录'],linked:['Linked','已关联'],used:['Used','采用'],rejected:['Rejected','舍弃'],used_and_rejected:['Used and rejected','采用且舍弃'],local_v1:['Local v1 evidence','本地 v1 依据'],archive_reviewed:['Archive-reviewed association','存档 review 关联'],complete:['Complete','完整'],partial:['Partial','部分'],missing:['Missing','缺失'],context_limit:['Context budget','上下文预算'],output_limit:['Output limit','输出限制'],unsupported_context:['Unsupported assembly','不支持装配'],visible:['Visible return recorded','已记录可见返回'],ref_visible:['Reference visible','引用可见'],not_applicable:['Not applicable','不适用']};
  const label=x=>words[x]?tr(...words[x]):x??unknown();
  const json=x=>JSON.stringify(x,null,2);
  let selected=null,round='',initial=true;
  const opened=new Set();
  const navLink=document.getElementById('knowledge-link');
  function openNavigation(){
    const panel=document.querySelector('#knowledge-navigation > details');
    if(!panel || navLink?.hidden)return;
    opened.add('navigation');panel.open=true;
    const summary=panel.querySelector('summary');
    summary.focus({preventScroll:true});summary.scrollIntoView({block:'start'});
  }
  if(navLink){
    navLink.addEventListener('click',event=>{
      if(!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey && location.hash===navLink.hash){
        event.preventDefault();openNavigation();
      }
    });
    window.addEventListener('hashchange',()=>{if(location.hash===navLink.hash)openNavigation();});
  }
  function fold(box,title,key,draw){const d=el('details');if(key==='navigation')d.className='panel';d.dataset.ktKey=key;d.dataset.liveKey='kt:'+key;d.dataset.key='kt:'+key;d.open=opened.has(key);d.append(el('summary',title));d.addEventListener('toggle',()=>{if(!d.isConnected)return;if(d.open)opened.add(key);else opened.delete(key);});box.append(d);draw(d);return d;}
  const p=(box,text,cls)=>{const n=el('p',text);if(cls)n.className=cls;box.append(n);return n;};
  function table(box,headers,rows){const wrap=el('div');wrap.className='kt-scroll';
    wrap.tabIndex=0;wrap.setAttribute('role','region');
    wrap.setAttribute('aria-label',[box.closest('details')?.querySelector('summary')?.textContent,headers[0]].filter(Boolean).join(' · '));
    const t=el('table'),head=el('thead'),hr=el('tr'),body=el('tbody');headers.forEach(h=>{const th=el('th',h);th.scope='col';hr.append(th);});head.append(hr);rows.forEach(cells=>{const row=el('tr');cells.forEach(v=>{const cell=el('td');cell.append(v instanceof Node?v:document.createTextNode(v==null?unknown():String(v)));row.append(cell);});body.append(row);});t.append(head,body);wrap.append(t);box.append(wrap);}
  function button(box,text,callback){const b=el('button',text);b.type='button';b.onclick=callback;box.append(b);return b;}
  function captureById(id){return getData().knowledge_trace?.retrievals?.find(c=>c.context_id===id);}
  function showCapture(id,keepRound=false){
    selected=id;if(!keepRound)round='';
    opened.add('navigation');opened.add('navigation:'+id);render();
    const panel=[...document.querySelectorAll('#knowledge-navigation [data-kt-key]')].find(d=>d.dataset.ktKey==='navigation:'+id);
    if(panel){const summary=panel.querySelector('summary');summary.focus({preventScroll:true});summary.scrollIntoView({block:'start'});}
    else openNavigation();
  }
  function queryText(request){
    const terms=[request?.query,request?.relevance].filter(v=>typeof v==='string'&&v.trim());
    if(terms.length)return [...new Set(terms)].join(' · ');
    return Array.isArray(request?.ids)&&request.ids.length?request.ids.join(', '):null;
  }
  function captureTerms(c){
    const cue=c.trace?.selection?.cue||c.selection?.cue;
    return queryText(c.trace?.request)||queryText(c.request)||(cue?tr('Ranking cue','排序线索')+' · '+cue:null);
  }
  function links(box,entries,scope){
    if(!entries?.length){p(box,tr('No candidate/run association recorded.','未记录候选/运行关联。'),'kt-note');return;}
    for(const link of entries){const row=getData().candidates.find(r=>r.experiment_id && r.experiment_id===link.experiment_id);
      const title=['R'+link.round,link.candidate_id,link.run_id||unknown()].join(' · ');
      if(link.state==='linked' && row){button(box,title,()=>openRun(link));p(box,[row.verdict,row.quality,row.outcome].map(label).join(' · '));fold(box,tr('Changes and result artifacts','改动与结果证据'),scope+':run:'+row.experiment_id,d=>d.append(el('pre',json({changes:row.optimization?.code_locations,artifacts:row.artifacts}))));}
      else p(box,title+' · '+label(link.state),'kt-warning');
    }
  }
  function trace(box,raw,scope='capture'){
    const c=captureById(raw.context_id)||raw, o=c.trace||{},request=o.request||c.request||{},selection=o.selection||{};
    const root=el('div');root.className='kt-view';box.append(root);
    fold(root,tr('Retrieval path and ranking','检索路径与排序')+' · '+c.context_id,scope+':'+c.context_id,b=>{
      p(b,captureTerms(c)||tr('No search terms recorded.','未记录检索词。'),'kt-query');
      if(c.purpose)p(b,c.purpose);
      p(b,(o.calls?.length?o.calls.join(' → '):tr('Entry point unknown','入口未知')),'kt-path');
      p(b,[label(selection.state),selection.method,selection.scope,selection.ranking_applied===true?tr('ranking_applied=true','ranking_applied=true'):selection.ranking_applied===false?'ranking_applied=false':tr('Ranking execution unknown','排序执行情况未知')].filter(Boolean).join(' · '));
      const counts=o.counts||{};
      table(b,[tr('Matched','匹配'),tr('Returned','返回选中'),tr('Assembly stage','正文装配阶段'),tr('Assembled groups','已装配组数')],[[counts.matched,counts.returned??c.items?.length,label(o.assembly),o.assembly==='performed'?c.contexts?.length:null]]);
      p(b,tr('Prepared context does not prove delivery or use. Associations do not establish performance causation.','准备上下文不证明模型已收到或使用。关联不证明性能收益的因果关系。'),'kt-note');
      if(!c.used_refs?.length)p(b,tr('used_refs: use not recorded in this field; other search evidence is shown separately.','used_refs：此字段未记录使用；其他搜索依据单独展示。'),'kt-note');
      const scores=new Map((o.items||[]).map(x=>[x.ref,x]));
      const loaded=new Set((c.contexts||[]).filter(x=>x.resources?.length).map(x=>x.ref));
      const omitted=new Map((c.context_omissions||[]).map(x=>[x.ref,x.reason]));
      if(c.used_refs?.some(ref=>omitted.has(ref)))p(b,tr('A declared use names text omitted from this capture. Check its separate evidence.','声明采用的条目包含本快照省略的正文，请核对其独立依据。'),'kt-warning');
      table(b,[tr('Order','顺序'),tr('Knowledge / version','知识 / 版本'),tr('Score','分数'),tr('Assembly','正文装配'),tr('Caller declaration','调用者声明')],(c.items||[]).map((item,i)=>{
        const detail=el('div');detail.append(el('strong',item.title||item.ref));
        if(item.title && item.title!==item.ref)p(detail,item.ref);
        p(detail,item.revision||unknown());
        fold(detail,tr('Resources, sources and score components','资源、来源与分数组成'),scope+':item:'+c.context_id+':'+item.ref,d=>{
          d.append(el('pre',json({title:item.title,authority:item.authority,entrypoint:item.entrypoint,sources:item.sources,skill_documents:item.skill_documents,score:scores.get(item.ref)??null,assembled:(c.contexts||[]).find(x=>x.ref===item.ref)})));
        });
        const rejection=c.rejected_refs?.find(r=>r.ref===item.ref);
        const use=c.used_refs?.includes(item.ref)?tr('Reported used','声明采用'):rejection?[tr('Reported rejected','声明舍弃'),rejection.reason].filter(Boolean).join(' · '):unknown();
        return [i+1,detail,scores.get(item.ref)?.score,o.assembly==='not_requested'?label('not_requested'):loaded.has(item.ref)?tr('Assembled','已装配'):label(omitted.get(item.ref)||'unknown'),use];
      }));
      for(const note of c.takeaways||[])p(b,note);
      if(c.assembled_text){
        const title=tr('Captured context text','当次检索装配的正文');
        fold(b,title,scope+':text:'+c.context_id,d=>{
          p(d,[c.path,c.expected_sha256&&'SHA-256 '+c.expected_sha256].filter(Boolean).join(' · '),'kt-note');
          const pre=el('pre');d.append(pre);
          const fill=()=>{if(d.open){pre.textContent=c.assembled_text;d.removeEventListener('toggle',fill);}};
          d.addEventListener('toggle',fill);fill();
        });
      }
      fold(b,tr('Request, filters, limits and tie rule','请求、过滤、预算与并列规则'),scope+':request:'+c.context_id,d=>d.append(el('pre',json({request,implementation:o.implementation,selection,counts,context_budget:c.context_budget,context_bytes_used:c.context_bytes_used,omissions:c.omissions,context_omissions:c.context_omissions,candidate_details:o.candidate_details}))));
      if(c.display_redacted)p(b,tr('Display redacted; hashes identify the original capture bytes. Review the full bundle before sharing.','展示已脱敏；哈希标识原始快照字节。分享前请审核完整文件。'),'kt-note');
      links(b,c.links,scope+':'+c.context_id);
    });
  }
  function adoption(box,s){
    const a=s.adoption,complete=s.coverage==='complete';
    const gap=()=>!a?unknown():tr('Unknown (incomplete capture)','未知（采集不完整）');
    // A rate is derived only for a complete round with a nonzero denominator.
    const ratio=(part,den)=>{
      if(a&&complete&&part?.state==='unknown'&&a.attribution_unknown>0)return tr('Unknown (attribution ambiguous)','未知（归属不明确）');
      if(!a||part?.state==='unknown')return gap();
      if(part.state==='not_applicable')return tr('Not applicable (zero denominator)','不适用（分母为零）');
      const n=part.adopted,d=part[den],pct=n===d?100:Math.min(99.9,Math.round(1000*n/d)/10);
      return n+' / '+d+' ('+pct+'%)';
    };
    const versions=!a||!complete?gap():a.unique_hit_revisions==null?tr('Unknown (a hit has no recorded revision)','未知（存在未记录版本的命中）'):a.unique_hit_revisions;
    table(box,[tr('Adoption measure','采用口径'),tr('Value','数值'),tr('Definition','定义')],[
      [tr('Search-hit adoption','检索命中采用'),ratio(a?.search_hits,'unique_hits'),tr('Distinct search-hit refs with recorded use evidence / distinct refs returned by a search in this round.','有采用依据的去重检索命中条目 / 本轮检索返回的去重条目。')],
      [tr('Direct-read adoption','直接读取采用'),ratio(a?.direct_reads,'read_only'),tr('Distinct refs with an observed read at a revision no search returned in this round, whose use evidence cites that read / those refs. A capture read counts only when its return of the ref was observed. Not search conversion.','本轮在检索未返回的版本上有已观测读取的去重条目中，采用依据指向该读取者 / 此类条目。捕获中的读取仅在观测到该条目返回时计入。不计为检索转化。')],
      [tr('Reads without observed delivery (no rate)','未观测送达的读取（无比率）'),!a||!complete?gap():tr('Refs: ','条目：')+a.unverified_reads.refs+' · '+tr('with use evidence: ','有采用依据：')+a.unverified_reads.adopted,tr('Distinct refs selected by explicit ID in a capture whose return of the ref was not observed (prepared only or delivery unknown). Not counted as reads.','在捕获中按显式 ID 选取、但未观测到该条目返回的去重条目（仅准备或送达未知）。不计为读取。')],
      [tr('Other adopted (no denominator)','其他采用（无分母）'),!a||!complete?gap():a.other_adopted,tr('Adopted refs observed only by other operations, such as an inventory. No rate is shown.','仅由其他操作（如清单列举）观测到的采用条目。不计算比率。')],
      [tr('Attribution unknown (no denominator)','归属未知（无分母）'),!a||!complete?gap():a.attribution_unknown,tr('Adopted refs whose use evidence cannot be credited to one observation: it cites both a search hit and a direct read, names an event that did not observe the ref, or cites a read whose revision cannot be matched to a hit because only one side records a revision. While nonzero, both rates are unknown.','采用依据无法归于单一观测的条目：同时指向检索命中与直接读取、所指事件未观测到该条目，或所指读取因仅一方记录版本而无法与命中匹配。非零时两个比率均为未知。')],
      [tr('Unique hit versions (ref, revision)','去重命中版本（条目, 版本）'),versions,tr('Distinct (ref, revision) pairs among search hits. Unknown when any hit lacks a revision.','检索命中中去重的（条目, 版本）对。任一命中缺版本时为未知。')],
    ]);
    p(box,tr('Counts are distinct refs; adoption is recorded per ref, not per revision, and is credited to the observation its use evidence cites. A zero denominator is not applicable rather than 0%. These are associations only: they do not establish causal or performance credit and include no token or cost data.','计数均按去重条目；采用按条目记录而非按版本，并归属于其采用依据所指向的观测。分母为零时为不适用，而非 0%。以上仅为关联，不证明因果或性能收益，也不含 token 或费用数据。'),'kt-note');
  }
  function search(box,s){
    fold(box,'R'+s.round+' · v'+s.schema_version+' · '+label(s.coverage||s.state),s.path,b=>{
      p(b,s.path+' · SHA-256 '+(s.sha256||unknown()));
      if(s.state!=='recorded'){p(b,label(s.state),'kt-warning');return;}
      p(b,s.schema_version===1?tr('Local v1: retained legacy use semantics; not archive-reviewed evidence.','本地 v1：保留旧版使用口径，不属于存档 review 关联。'):tr('Portable v2: declarations and archive-reviewed associations are separate.','可移植 v2：声明与存档 review 关联分开展示。'),'kt-note');
      p(b,tr('v1 and v2 are alternative records of this round; counts are not added.','v1/v2 是同轮的不同记录，计数不相加。'),'kt-note');
      table(b,[tr('Coverage','覆盖'),tr('Counts','完整计数'),tr('Observed in supplied records','所提供记录中的观测')],[[label(s.coverage),s.counts==null?unknown():json(s.counts),json(s.observed)]]);
      adoption(b,s);
      for(const issue of s.issues||[])p(b,label(issue),'kt-warning');
      for(const id of s.context_ids||[])button(b,tr('Open retrieval · ','打开检索 · ')+id,()=>showCapture(id));
      table(b,[tr('Material','条目'),tr('Recorded use','记录的采用状态'),tr('Evidence / declaration','依据 / 声明')],(s.materials||[]).map(m=>{
        const d=el('div');
        for(const e of m.evidence||[])fold(d,label(e.state),s.path+':evidence:'+m.ref+':'+json(e),node=>node.append(el('pre',json(e))));
        if(m.declarations?.length)d.append(el('pre',json(m.declarations)));
        if(m.conflicts?.length)d.append(el('pre',json(m.conflicts)));
        return [m.ref,label(m.use),d];
      }));
      fold(b,tr('Caller declarations','调用者声明'),s.path+':declarations',d=>d.append(el('pre',json(s.declarations??[]))));
      fold(b,tr('Searches, reads, delivery and source versions','搜索、读取、返回及来源版本'),s.path+':events',d=>{
        for(const [i,e] of (s.events||[]).entries()){
          const action=e.action==='search'?tr('Search','检索'):e.action==='read'?tr('Read','读取'):label(e.action);
          const title=[action,e.tool,e.context_id||e.id].filter(Boolean).join(' · ');
          fold(d,title,s.path+':operation:'+i,entry=>{
            const query=e.query||queryText(e.request);if(query)p(entry,query,'kt-query');
            if(Array.isArray(e.scope)&&e.scope.length)p(entry,tr('Scope','检索范围')+' · '+e.scope.join(', '));
            if(e.materials.length)table(entry,[tr('Recorded material','记录条目'),tr('Revision','版本')],e.materials.map(m=>[m.ref,m.revision]));
            else p(entry,tr('No material recorded for this operation.','此次操作未记录知识条目。'));
            if(e.delivery)p(entry,tr('Delivery','返回状态')+' · '+label(e.delivery.state));
            fold(entry,tr('Event evidence','事件证据'),s.path+':operation-evidence:'+i,node=>node.append(el('pre',json(e))));
          });
        }
        if(s.corpus||s.unresolved_details?.length)d.append(el('pre',json({corpus:s.corpus,unresolved_details:s.unresolved_details})));
      });
      links(b,s.links,s.path);
    });
  }
  function render(){
    const root=document.getElementById('knowledge-navigation');if(!root)return;
    root.replaceChildren();root.classList.add('kt-view');root.setAttribute('data-no-translate','');
    const view=getData(),data=view.knowledge_trace||{}, captures=data.retrievals||[],searches=data.searches||[];
    const service=view.evaluation_mode==='service_reuse', deliveries=service?view.managed_retrievals||[]:[];
    const title=tr('Knowledge trace','知识检索 Trace');
    if(navLink){navLink.textContent=title;navLink.hidden=!service&&!captures.length&&!searches.length;}
    fold(root,title,'navigation',box=>{
      const rounds=[...new Set([...searches.map(s=>s.round),...captures.flatMap(c=>(c.links||[]).map(l=>l.round)),...deliveries.map(d=>d.round)].filter(Number.isInteger))].sort((a,b)=>a-b);
      if(round && !rounds.includes(Number(round)))round='';
      const control=el('select');control.setAttribute('aria-label',tr('Knowledge round','知识轮次'));control.append(new Option(tr('All rounds','全部轮次'),''));rounds.forEach(n=>control.append(new Option('R'+n,String(n))));control.value=round;control.onchange=()=>{round=control.value;selected=null;render();};box.append(control);
      if(service){
        const visible=deliveries.filter(d=>!round||d.round===Number(round));
        if(!visible.length)p(box,tr('No retrieval capture recorded.','未记录检索快照。'));
        for(const delivery of visible){
          const detail=fold(box,delivery.query||delivery.path,'service:'+delivery.path,part=>{
            const label=Number.isInteger(delivery.round)?'R'+delivery.round:tr('Round not recorded','轮次未记录');
            p(part,label+' · '+delivery.path,'kt-note');
            if(delivery.search_ref)p(part,tr('Find receipt','检索凭据')+' · '+delivery.search_ref,'kt-note');
            if(delivery.state==='unavailable'){
              p(part,tr('Retrieval capture is unavailable.','检索快照不可用。'),'kt-warning');
              return;
            }
            const countLabel=delivery.retained_only?tr('Retained contexts','已留存上下文'):tr('Returned items','返回条目');
            p(part,countLabel+' · '+delivery.items.length);
            const list=el('ul');part.append(list);
            for(const item of delivery.items){
              const row=el('li');list.append(row);
              p(row,[item.title||item.ref,item.revision].filter(Boolean).join(' · '));
              if(delivery.kind!=='knowledge_search'){
                p(row,item.delivered?tr('Context assembled','正文已装配'):tr('Context omitted','正文被省略'),'kt-note');
              }
            }
          });
          detail.dataset.serviceDelivery=delivery.path;
        }
        return;
      }
      const visible=captures.filter(c=>!round || c.links?.some(l=>l.round===Number(round)) || searches.some(s=>s.round===Number(round) && s.context_ids?.includes(c.context_id)));
      if(selected && !visible.some(c=>c.context_id===selected)){p(box,tr('Selection no longer available','所选记录已不可用'),'kt-warning');selected=null;}
      if(!visible.length)p(box,tr('No retrieval capture recorded.','未记录检索快照。'));
      const cards=el('div');cards.className='kt-captures';box.append(cards);
      for(const c of visible){
        const card=el('article');card.className='kt-capture';cards.append(card);
        const rounds=[...new Set((c.links||[]).map(l=>l.round).filter(Number.isInteger))];
        const metadata=[...rounds.map(n=>'R'+n),c.captured_at].filter(Boolean);
        if(metadata.length)p(card,metadata.join(' · '),'kt-note');
        button(card,c.context_id,()=>showCapture(c.context_id,true)).setAttribute('aria-pressed',String(selected===c.context_id));
        const query=captureTerms(c);if(query)p(card,query);
        p(card,c.state==='verified'?tr('Returned items','返回条目')+' · '+c.items.length:label(c.state),'kt-note');
      }
      for(const c of visible.filter(c=>!selected || c.context_id===selected)){
        if(c.state!=='verified')p(box,c.context_id+' · '+label(c.state),'kt-warning');
        else trace(box,c,'navigation');
      }
      const filtered=searches.filter(s=>!round||s.round===Number(round));
      if(!filtered.length)p(box,tr('Shared round search record not recorded.','未记录共享逐轮搜索记录。'),'kt-note');
      filtered.forEach(s=>search(box,s));
    });
    if(initial){
      initial=false;
      if(navLink && location.hash===navLink.hash){
        openNavigation();
        window.addEventListener('load',()=>requestAnimationFrame(()=>{
          if(location.hash===navLink.hash && document.activeElement===document.body)openNavigation();
        }),{once:true});
      }
    }
  }
  function backLinks(box,row){
    if(!row)return;const view=getData(),all=view.knowledge_trace||{};
    if(row.service_attempt){
      const section=el('div');section.className='kt-view';section.setAttribute('data-no-translate','');box.append(section);
      const deliveries=(view.managed_retrievals||[]).filter(d=>row.service_attempt.available_contexts.includes(d.path));
      p(section,tr('Retrieval snapshots available at submission','提交时可用的检索快照'));
      if(!deliveries.length)p(section,tr('No explicit knowledge association recorded.','未记录明确的知识关联。'),'kt-note');
      for(const delivery of deliveries)button(section,delivery.query||delivery.path,()=>{
        round='';opened.add('navigation');opened.add('service:'+delivery.path);render();
        const entry=[...document.querySelectorAll('[data-service-delivery]')].find(node=>node.dataset.serviceDelivery===delivery.path);
        entry?.querySelector('summary').focus();entry?.scrollIntoView({block:'start'});
      });
      return;
    }
    const captures=(all.retrievals||[]).filter(c=>c.links?.some(l=>l.state==='linked' && l.experiment_id===row.experiment_id));
    const searches=(all.searches||[]).filter(s=>s.links?.some(l=>l.state==='linked' && l.experiment_id===row.experiment_id));
    const section=el('div');section.className='kt-view';section.setAttribute('data-no-translate','');box.append(section);
    p(section,tr('Knowledge associated with this run','本次运行关联的知识')+' · R'+row.round+' · '+row.candidate_id+' · '+(row.run_id||unknown()));
    if(!captures.length && !searches.length)p(section,tr('No explicit knowledge association recorded.','未记录明确的知识关联。'),'kt-note');
    captures.forEach(c=>button(section,tr('Open retrieval · ','打开检索 · ')+c.context_id,()=>showCapture(c.context_id)));
    searches.forEach(s=>button(section,'R'+s.round+' · v'+s.schema_version,()=>{round=String(s.round);selected=null;opened.add('navigation');opened.add(s.path);render();const d=document.querySelector('#knowledge-navigation > details');d.open=true;d.querySelector('summary').focus();d.scrollIntoView({block:'start'});}));
  }
  return {render,trace,backLinks,openCapture:showCapture,openRun};
}};
</script>
