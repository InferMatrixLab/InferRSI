<title>Service-reuse optimization</title>
<style>
:root { color-scheme:dark; --bg:#0c121c; --panel:#121c29; --panel2:#192535;
  --line:#304051; --ink:#eef4fc; --muted:#b0bece; --accent:#69e5cd; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 system-ui,sans-serif; }
main { max-width:1100px; margin-inline:auto; padding:clamp(12px,3vw,36px);
  display:grid; gap:14px; overflow-wrap:anywhere; }
main > * { min-width:0; border:1px solid var(--line); border-radius:10px;
  background:var(--panel); padding:clamp(12px,2vw,24px); }
main > header { border-block-start:3px solid var(--accent); }
h1 { font-size:clamp(22px,3vw,32px); line-height:1.2; margin:0 0 .7rem; }
h2 { font-size:17px; line-height:1.35; margin:0 0 .6rem; }
p { color:var(--muted); margin:.35rem 0; }
ul { color:var(--muted); margin:.75rem 0 0; padding-inline-start:1.4rem; }
.objective-scroll { overflow-x:auto; margin-block:1rem; }
table { width:100%; min-width:34rem; border-collapse:collapse; }
caption { padding-block-end:.5rem; text-align:start; color:var(--muted); }
th, td { padding:8px 12px; border-bottom:1px solid var(--line); text-align:start; }
th { background:var(--panel2); }
td { font-variant-numeric:tabular-nums; }
summary { cursor:pointer; font-weight:600; }
pre { max-height:32rem; overflow:auto; white-space:pre-wrap; background:var(--bg);
  border:1px solid var(--line); border-radius:6px; padding:12px; margin-block:12px 0; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body><main>__DASHBOARD_CHART__</main></body>
</html>
