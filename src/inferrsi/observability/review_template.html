<style>
:root{color-scheme:dark;--bg:#121519;--panel:#181b1f;--line:#343b43;--sub:#aeb8c4;--text:#ecf0f3;--accent:#86c8ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
main,header>div{width:min(1080px,calc(100% - 48px));margin:auto}
header{border-bottom:1px solid var(--line);background:var(--panel)}
header>div{display:flex;align-items:center;gap:14px;min-height:52px;flex-wrap:wrap;padding:8px 0}

button,summary{cursor:pointer;color:var(--accent)}

h1,h2,h3,p,figure,dl{margin:0}h1,h2{font-size:20px;line-height:1.35;margin-bottom:12px}h3{font-size:16px}
p+p{margin-top:6px}.goal{font-size:19px;font-weight:550}.note,small,dt{color:var(--sub)}
ul{margin:.45em 0 0;padding-left:1.35em}code,pre,.value,td{font-variant-numeric:tabular-nums}
code,pre{font-family:Consolas,"Microsoft YaHei",monospace}code{overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0 0}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px 9px 7px 0;vertical-align:top}
th{font-size:13px;color:var(--sub);font-weight:500}.value{font-weight:650}
.metrics{display:flex;gap:18px 40px;flex-wrap:wrap;margin:14px 0}
.metrics dd{margin:2px 0 0;font-weight:650;font-size:22px;line-height:1.4}.metrics dt{font-size:13px}

.tag{display:inline-block;margin-right:8px;color:var(--accent);font-size:13px}
details{margin-top:8px;font-size:13px}details details{margin-left:10px}
.panel{margin:0;font-size:inherit}.panel>summary{font-weight:650;color:var(--text)}
.panel-heading{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%)}
.panel>summary{font-size:17px}.panel[open]>summary{margin-bottom:14px}
.panel>summary::marker{color:var(--accent)}.panel .capture, .panel td{overflow-wrap:anywhere}
.timing-scroll{overflow-x:auto}.experiment-lane{display:grid;grid-template-columns:minmax(90px,17%) 1fr;align-items:center;gap:8px;margin:6px 0;color:var(--sub)}
.experiment-track{height:19px;position:relative;background:var(--bg);border-radius:3px}

.experiment-lane:nth-of-type(2) .interval{background:#c3a6fa}.experiment-lane:nth-of-type(3) .interval{background:#6bc1ad}

.experiment-steps.timing-scroll td:last-child{white-space:normal;text-align:left}.experiment-steps td:first-child{min-width:12em}
#baseline>h3:not(:first-child){margin-top:20px}
.timing-scroll table{width:auto;min-width:min(100%,600px)}
.timing-scroll td:not(:first-child),.timing-scroll th:not(:first-child){text-align:right;white-space:nowrap}
.capture-fold{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.capture-fold>summary{font-weight:600}.capture-fold details{margin-block:8px}
details p,details pre{margin:5px 0 4px 12px;overflow-wrap:anywhere}
pre{max-height:22rem;overflow:auto;white-space:pre-wrap;padding:9px 12px;background:var(--bg);color:var(--sub)}
.trend figure{margin:0}.trend h1{margin-bottom:4px}#chart{overflow-x:auto}#chart svg{display:block;width:100%;min-width:540px;max-height:390px;height:auto}
.capture+.capture{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.capture h3{margin:0 0 4px}.capture .meta{font:13px/1.65 Consolas,"Microsoft YaHei",monospace;color:var(--sub);overflow-wrap:anywhere}
.capture h4{font-size:14px;margin:12px 0 5px}.capture>p{margin:5px 0}
.trace-controls,.legend{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin:10px 0}
.trace-controls button{font:inherit;font-size:14px;padding:3px 10px}.trace-controls button:disabled{color:var(--sub);opacity:.55;cursor:default}
.trace-controls input{flex:1 1 110px;max-width:300px;accent-color:var(--accent)}
.trace-controls output{font:13px Consolas,monospace;color:var(--sub)}
.legend{font-size:12px;color:var(--sub)}.legend span:before{display:inline-block;content:"";width:9px;height:9px;border-radius:2px;background:var(--swatch);margin-right:5px}
.trace-scroll{max-height:390px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:5px}
.track{display:grid;grid-template-columns:minmax(92px,17%) minmax(0,1fr);align-items:center;min-height:35px;border-bottom:1px solid #30353c;background:#16191d}
.track:last-child{border-bottom:0}.track-label{padding:4px 8px;font:12px/1.3 Consolas,"Microsoft YaHei",monospace;color:#c1ccd4;overflow-wrap:anywhere}
.track canvas{display:block;width:100%;height:34px;touch-action:pan-y;cursor:crosshair}
.scale{position:sticky;top:0;background:#20262d;z-index:1;min-height:25px}.ticks{display:flex;justify-content:space-between;font:11px Consolas,monospace;color:var(--sub);padding:2px 4px}
.selection{font:13px/1.5 Consolas,"Microsoft YaHei",monospace;overflow-wrap:anywhere;color:var(--accent);min-height:1.6em}
.file-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.file-tools input{max-width:100%;font-size:12px}
.trace-table{overflow:auto;max-height:280px}.trace-table th{position:sticky;top:0;background:var(--panel)}.trace-table td{overflow-wrap:anywhere}
.trace-table button{font:inherit;text-align:left;border:0;padding:0}.trace-status{color:var(--accent)}a{color:var(--accent)}
.decisions{display:grid;gap:8px}.decision{display:grid;grid-template-columns:4em 9em 1fr;gap:12px;border-top:1px solid var(--line);padding-top:8px}
@media(max-width:640px){main,header>div{width:calc(100% - 24px)}section{padding:15px;margin-bottom:14px}main{padding:18px 0}.metrics{gap:10px 20px}.decision{grid-template-columns:3em 1fr;gap:4px}.decision .note{grid-column:2}header>div{gap:8px}.goal{font-size:17px}}
</style>

<body>
<header><div><strong>InferRSI</strong><code id="campaign"></code><small id="mode"></small><small id="connection" role="status"></small><button id="language" type="button"></button></div></header>
<main>
<section class="trend" aria-labelledby="chart-title"><figure><h1 id="chart-title"></h1><div class="note" id="chart-note"></div><div id="chart">__DASHBOARD_CHART__</div></figure></section>
<section aria-labelledby="goal-title"><h2 class="panel-heading" aria-labelledby="goal-title"></h2><details class="panel" data-key="goal"><summary><span id="goal-title"></span></summary><div id="goal"></div></details></section>
<section id="story-checks" hidden aria-labelledby="checks-title"><h2 class="panel-heading" aria-labelledby="checks-title"></h2><details class="panel" data-key="checks"><summary><span id="checks-title"></span> <span id="checks-count"></span></summary><ul id="checks-list"></ul></details></section>
<section aria-labelledby="baseline-title"><h2 class="panel-heading" aria-labelledby="baseline-title"></h2><details class="panel" data-key="timings"><summary><span id="baseline-title"></span></summary><div id="baseline"></div></details></section>
<section id="capture-section" hidden aria-labelledby="captures-title"><h2 class="panel-heading" aria-labelledby="captures-title"></h2><details class="panel" data-key="profiles"><summary><span id="captures-title"></span></summary><div id="captures"></div></details></section>
<section aria-labelledby="gap-title"><h2 class="panel-heading" aria-labelledby="gap-title"></h2><details class="panel" data-key="gap"><summary><span id="gap-title"></span></summary><div id="gap"></div></details></section>
<section aria-labelledby="rounds-title"><h2 class="panel-heading" aria-labelledby="rounds-title"></h2><details class="panel" data-key="rounds"><summary><span id="rounds-title"></span></summary><div id="rounds"></div></details></section>
<section aria-labelledby="decision-title"><h2 class="panel-heading" aria-labelledby="decision-title"></h2><details class="panel" data-key="decisions"><summary><span id="decision-title"></span></summary><div class="decisions" id="decisions"></div></details></section>
</main>
<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
(() => {
'use strict';
const byId=id=>document.getElementById(id);
let data=JSON.parse(byId('dashboard-data').textContent);
const live=data.live===true;
let language='zh';
try { language=localStorage.getItem('inferrsi.dashboard.language')==='en'?'en':'zh'; } catch {}
let chart=byId('chart').innerHTML, connected=false, attempted=false, etag=null;
const tr=(zh,en)=>language==='zh'?zh:en;
const recorded=text=>{
  const overlay=data.translations?.[language];
  return typeof text==='string' && overlay && Object.hasOwn(overlay,text)?overlay[text]:text;
};
const dash='—', fmt=(v,n=3)=>Number.isFinite(v)?v.toFixed(n):dash;
const rowLabel=r=>Number.isInteger(r.round)?'R'+r.round:r.candidate_id;
function el(tag,text,cls){
  const item=document.createElement(tag);
  if(text!=null)item.textContent=String(text);
  if(cls)item.className=cls;
  return item;
}
const p=(parent,text,cls)=>parent.append(el('p',text,cls));
function metric(dl,label,value){
  const pair=el('div');pair.append(el('dt',label),el('dd',value));dl.append(pair);
}
function table(parent,headers,rows){
  const t=el('table'), head=t.createTHead().insertRow();
  for(const label of headers){const th=el('th',label);th.scope='col';head.append(th);}
  const body=t.createTBody();
  for(const values of rows){const row=body.insertRow();for(const value of values)row.insertCell().textContent=value;}
  parent.append(t);
}
function fold(parent,label,key,draw,opened){
  const f=el('details');f.dataset.key=key;f.append(el('summary',label));
  const content=el('div');f.append(content);parent.append(f);
  let built=false;
  function fill(){if(f.open&&!built){built=true;draw(content);}}
  f.addEventListener('toggle',fill);
  if(opened.has(key)){f.open=true;fill();}
  return f;
}
function verifiedProfile(r){
  const d=r.optimization_trace?.diagnosis, ref=r.artifacts?.profile;
  return d && ref?.state==='present' && /^[a-f0-9]{64}$/i.test(ref.sha256) &&
    ref.sha256.toLowerCase()===d.source_sha256?.toLowerCase()?d:null;
}
function median(values){
  const a=[...values].sort((x,y)=>x-y),i=Math.floor(a.length/2);
  return a.length%2?a[i]:(a[i-1]+a[i])/2;
}
function range(values){
  const lo=Math.min(...values),hi=Math.max(...values);
  return lo===hi?fmt(lo,3):fmt(lo,3)+'–'+fmt(hi,3);
}
function iteration(r){
  return data.story?.iterations?.find(i=>i.round===r.round && i.candidates.some(c=>c.candidate_id===r.candidate_id));
}
function profileTable(box,d){
  if(d.components.every(c=>c.samples.length===1)){
    table(box,[tr('阶段或算子','Stage or operator'),tr('采样用时','Sampled duration')+' ('+d.metric_unit+')'],
      d.components.map(c=>[recorded(c.name),fmt(c.samples[0])]));
    return;
  }
  table(box,[tr('阶段或算子','Stage or operator'),tr('耗时范围','Measured range')+' ('+d.metric_unit+')',
    tr('中位数','Median')+' ('+d.metric_unit+')'],
    d.components.map(c=>[recorded(c.name),range(c.samples),fmt(median(c.samples))]));
}
function status(state){
  const zh={completed:'已完成',running:'运行中',cancelled:'已中止',failed:'失败',crashed:'异常退出',queued:'已排队',
    passed:'通过',not_recorded:'未记录',pending:'待决策',adopted:'已采纳',rejected:'未采纳',rolled_back:'已回滚',
    no_gain:'未见收益',noise:'噪声范围内',regressed:'回退',improved:'改善',quality_failed:'质量检查失败'};
  return language==='zh'?(zh[state]||state||dash):(state||dash).replaceAll('_',' ');
}
// Diagnostics come from the evidence reader, so use fixed translations here.
// A caller's narrative translations must not relabel a conflict.
function checkText(text){
  if(language!=='zh')return text;
  const phrases={
    'was not retrieved by this capture':'本次检索没有返回该条目',
    'was not retrieved by any capture':'所有检索记录中均无该条目',
    'was not retrieved by the captures this round names':'本轮关联的检索没有返回该条目',
    'was selected but its text was omitted from the context':'命中该条目，但正文未载入上下文',
    'was selected by search but its text was omitted from the context':'命中该条目，但正文未载入上下文',
    'no recorded run':'没有运行记录','no unique recorded run':'运行记录不唯一',
    'unavailable run evidence':'运行证据不可用','no recorded outcome':'未记录结果',
    'file absent':'文件缺失',unreadable:'文件不可读','unsafe path':'路径不安全',
    'too large':'文件超过大小限制','invalid format':'格式无效','hash mismatch':'文件哈希不匹配',
    'resource hash mismatch':'资源哈希不匹配','assembly mismatch':'拼接内容不匹配',
    'identity mismatch':'采集标识不匹配',pruned:'已排除',untried:'未尝试',
    'failure summary':'失败总结','states a conclusion without evidence':'结论缺少证据引用',
    'marked tried, but no iteration lists a candidate for it':'标记为已尝试，但没有轮次列出对应候选方案'
  };
  if(Object.hasOwn(phrases,text))return phrases[text];
  const label=s=>status(s.replaceAll(' ','_'));
  const rules=[
    [/^knowledge (.+)$/,(_,id)=>'检索 '+id],
    [/^round (\d+)$/,(_,id)=>'第 '+id+' 轮'],
    [/^search space (.+)$/,(_,id)=>'搜索选项 '+id],
    [/^(success|failure) (\d+)$/,(_,kind,id)=>(kind==='success'?'成功记录 ':'失败记录 ')+id],
    [/^the log says (.+) was used, but it (.+)$/,(_,ref,why)=>'日志称采用了 '+ref+'，'+checkText(why)],
    [/^the log says (.+), rounds\.jsonl records (.+)$/,(_,log,file)=>'日志记为'+label(log)+'，rounds.jsonl 记为'+label(file)],
    [/^(.+) is cited, but it (.+)$/,(_,ref,why)=>'引用了 '+ref+'，'+checkText(why)],
    [/^cites (.+), which (.+)$/,(_,ref,why)=>'引用了 '+ref+'，'+checkText(why)],
    [/^capture (.+) is (.+); its text is not shown$/,(_,path,reason)=>'采集 '+path+' 不可用（'+checkText(reason)+'），正文已隐藏'],
    [/^(candidate|evidence) (.+) has (.+)$/,(_,kind,id,why)=>(kind==='candidate'?'候选方案 ':'证据 ')+id+'：'+checkText(why)],
    [/^candidate (.+) is recorded in round (\d+)$/,(_,id,num)=>'候选方案 '+id+' 记录在第 '+num+' 轮'],
    [/^the decision names (.+), which is not a candidate of this round$/,(_,id)=>'决定中指定的 '+id+' 不在本轮候选方案中'],
    [/^(.+) is adopted but its recorded outcome is (.+)$/,(_,id,outcome)=>'已采纳 '+id+'，其运行结果为'+label(outcome)],
    [/^marked (.+), but round (\d+) tried it$/,(_,state,num)=>'标记为'+checkText(state)+'，第 '+num+' 轮已尝试'],
    [/^evidence (.+) recorded (.+), not an improvement$/,(_,id,outcome)=>'证据 '+id+' 的结果为'+label(outcome)+'，未确认提升'],
    [/^evidence (\S+) (was .+)$/,(_,id,why)=>'证据 '+id+'：'+checkText(why)],
    [/^(.+) recorded (.+), but no failure cites it$/,(_,id,outcome)=>id+' 的结果为'+label(outcome)+'，失败总结未引用此项']
  ];
  for(const [pattern,format] of rules){const match=text.match(pattern);if(match)return format(...match);}
  return text;
}
function renderStoryChecks(){
  const checks=data.story?.checks||[];
  byId('story-checks').hidden=checks.length===0;
  byId('checks-title').textContent=tr('叙述与证据核对','Narrative vs evidence');
  byId('checks-count').textContent=checks.length?'('+checks.length+')':'';
  const list=byId('checks-list');list.replaceChildren();
  for(const check of checks){
    const severity=check.severity==='error'?tr('冲突','Conflict'):tr('警告','Warning');
    list.append(el('li',severity+' · '+checkText(check.where)+' · '+checkText(check.message)));
  }
}
function raw(parent,value){parent.append(el('pre',typeof value==='string'?value:JSON.stringify(value,null,2)));}
function retrievalDetails(box,c,key,opened){
  if(c.state!=='verified'){p(box,c.state||tr('未校验','Unverified'),'note');return;}
  if(c.purpose)p(box,recorded(c.purpose),'value');
  const request=c.request||{},selection=c.selection||{};
  p(box,tr('检索时间','Retrieved at')+' · '+(c.captured_at||dash),'meta');
  p(box,tr('查询','Query')+' · '+([request.query,request.relevance].filter(Boolean).join(' · ')||selection.cue||dash));
  p(box,tr('搜索逻辑','Search logic')+' · '+[selection.method,selection.scope,request.backend,
    Number.isInteger(request.limit)?'limit='+request.limit:null].filter(Boolean).join(' · '));
  if(selection.method==='task-lexical-v1' && selection.ranking_applied)
    p(box,tr('按查询词匹配条目：标题和摘要权重最高，通用或目标平台条目加权，再按返回上限截取。','Task terms are matched across fields. Title and summary weigh most; portable and target-platform entries get a boost. The result limit is applied after ranking.'),'note');
  if(selection.ranking_applied===false && request.ids?.length)
    p(box,tr('按指定 ID 和顺序返回','Returned in the requested ID order')+' · '+request.ids.join(', '),'note');
  if(Number.isInteger(selection.matched_count) && Number.isInteger(selection.returned_count))
    p(box,tr('匹配 '+selection.matched_count+' 条，返回 '+selection.returned_count+' 条。',
      selection.matched_count+' matched; '+selection.returned_count+' returned.'));
  const used=new Set(c.used_refs||[]),loaded=new Set((c.contexts||[]).filter(x=>x.resources?.length).map(x=>x.ref));
  const rejected=new Map((c.rejected_refs||[]).map(x=>[x.ref,recorded(x.reason)]));
  if(c.items?.length)table(box,[tr('返回顺序','Rank'),tr('知识条目','Result'),tr('上下文 / 采用情况','Context / use')],c.items.map((x,i)=>[
    i+1,x.title||x.ref,[loaded.has(x.ref)?tr('已载入','Included'):tr('未载入','Omitted'),
      used.has(x.ref)?tr('记录为采用','Reported used'):rejected.get(x.ref)].filter(Boolean).join(' · ')]));
  for(const note of c.takeaways||[])p(box,recorded(note));
  fold(box,tr('完整拼接上下文','Full assembled context')+' · '+(c.context_bytes_used??0)+' B',key+'-text',b=>{
    p(b,'SHA-256 · '+c.assembled_sha256,'meta');raw(b,c.assembled_text);
  },opened);
  fold(box,tr('检索参数、来源与排除原因','Search parameters, sources and omissions'),key+'-source',b=>
    raw(b,{request,selection,items:c.items,files:c.contexts,used_refs:c.used_refs,rejected_refs:c.rejected_refs,
      omissions:c.omissions,context_omissions:c.context_omissions,sha256:c.expected_sha256}),opened);
}
function details(box,r,it,opened){
  const key=JSON.stringify([r.round,r.candidate_id,r.run_id]);
  fold(box,tr('轮次详情','Round details'),key,body=>{
    for(const id of it?.context_ids||[]){
      const capture=data.story?.retrievals?.find(c=>c.context_id===id);
      if(capture)fold(body,tr('检索记录','Retrieval')+' · '+id,key+'-capture-'+id,
        b=>retrievalDetails(b,capture,key+'-round-'+id,opened),opened);
    }
    const nodes=r.run_workflow?.nodes||[];
    if(nodes.length)fold(body,tr('实验执行耗时（与单次请求分开计时）','Trial execution times (separate from request latency)'),key+'-execution',b=>{
      table(b,[tr('环节','Operation'),tr('开始时间','Started'),tr('记录用时','Recorded time')],nodes.map(n=>[
        [n.kind,n.side,n.trial].filter(x=>x!=null).join(' · '),n.start||dash,Number.isFinite(n.seconds)?fmt(n.seconds)+' s':dash]));
    },opened);
    const trace=r.optimization_trace;
    if(trace){
      const space=trace.search_space;
      if(space?.items?.length || space?.selection_rules?.length){
        p(body,tr('候选方向与选择依据','Options and selection rules'),'value');
        for(const o of space.items||[])p(body,o.id+' · '+recorded(o.description));
        for(const rule of space.selection_rules||[])p(body,recorded(rule),'note');
      }
      for(const s of trace.steps?.items||[]){
        p(body,s.sequence+'. '+recorded(s.action),'value');
        if(s.motivation)p(body,recorded(s.motivation),'note');
        if(s.result)p(body,recorded(s.result));
      }
    }
    if(trace)fold(body,tr('轮次原始 trace','Recorded round trace'),key+'-trace',b=>{
      const text=trace.context?.text;
      const context=text && typeof text==='object'?{...trace.context,text:data._context_pool?.[text.$context]}:trace.context;
      raw(b,{...trace,context});
    },opened);
    fold(body,tr('证据文件与哈希','Evidence files and hashes'),key+'-artifacts',b=>raw(b,r.artifacts),opened);

    agent_event:tr('Agent 事件','Agent event'),baseline:tr('基线','Baseline'),candidate:tr('候选','Candidate'),
    run_events:tr('源码快照开始至运行结束','Snapshot start to terminal event'),
    command:tr('命令实测','Measured command duration'),phase:tr('阶段实测','Measured phase duration'),
    event:tr('阶段事件','Phase event'),capture_saved:tr('检索快照写入','Retrieval saved'),
    log_saved:tr('复盘版本写入','Review saved'),profile_start:tr('采集开始时间','Recorded profile start'),
    request_response:tr('请求事件至响应事件','Request to response event'),incomplete:tr('调用边界不完整','Incomplete call bounds')
  };
  const name=s=>Object.hasOwn(names,s)?names[s]:recorded(s);
  const seconds=s=>Number.isFinite(s)?fmt(s,3)+' s':tr('未记录','Unmeasured');
  const clock=t=>t?t.replace('T',' ').replace(/(\.\d{3})\d*/, '$1').replace('+00:00',''):dash;
  box.append(el('h3',tr('整个实验的耗时','Experiment wall time')));
  if(history.ledger==='unavailable')p(box,tr('补充计时文件未通过校验。','Supplemental timing evidence is unavailable.'),'note');
  if(!steps.length){p(box,tr('尚无实验步骤计时记录。','No experiment timing recorded.'),'note');return;}
  const totals=el('dl',null,'metrics');box.append(totals);
  const execution=history.execution_span;
  if(execution){
    metric(totals,tr('已记录的执行跨度','Recorded execution span'),seconds(execution.seconds));
    p(box,clock(execution.first)+' → '+clock(execution.last)+' UTC','meta');
  }else p(box,tr('缺少执行时间边界。','No execution bounds recorded.'),'note');
  for(const step of steps.filter(s=>s.kind==='run')){
    metric(totals,[rowLabel(step),'InferRSI',step.actor].filter(Boolean).join(' · '),seconds(step.seconds));
  }
  const groups=new Map();
  for(const call of calls){
    const key=call.model||tr('模型未记录','Unspecified model');
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(call);
  }
  for(const [model,items] of groups){
    const timed=items.filter(s=>Number.isFinite(s.seconds));
    metric(totals,model+' · '+tr('有耗时记录的调用','Calls with timing')+' '+timed.length+'/'+items.length,
      seconds(timed.length?timed.reduce((total,s)=>total+s.seconds,0):null));
  }
  if(!calls.length)p(box,tr('没有可关联的模型请求记录。','No correlated model requests recorded.'),'note');
  p(box,tr('跨度从最早到最晚的执行记录计算。模型调用、实验命令和 GPU 测量可能同时进行，各项时长不能直接相加。',
    'The span uses the earliest and latest execution timestamps. Model calls, commands and GPU measurements can overlap.'),'note');
  function stepTable(parent,items){
    const wrap=el('div',null,'timing-scroll experiment-steps');parent.append(wrap);
    const headers=[tr('步骤','Step'),tr('开始 UTC','Start UTC'),tr('结束 UTC','End UTC'),tr('耗时','Duration'),tr('计时依据','Timing evidence')];
    table(wrap,headers,items.map(s=>{
      const label=[s.round?'R'+s.round:null,s.actor,s.model,name(s.kind),
        s.label!==s.kind?name(s.label):null,s.side?name(s.side):null,s.trial?'#'+s.trial:null,
        s.state?status(s.state):null].filter(Boolean).join(' · ');
      return [label,clock(s.start),clock(s.end),seconds(s.seconds),[name(s.basis),s.evidence].filter(Boolean).join(' · ')];
    }));
  }
  fold(box,tr('按时间查看全部步骤','All steps in time order')+' ('+steps.length+')','experiment-all',b=>{
    const lanes=[
      [tr('InferRSI 执行','InferRSI execution'),['runner','run','knowledge','review']],
      [tr('模型调用','Model calls'),['model_call','agent_event']],
      [tr('采集与实验命令','Profiling and experiment commands'),['profile','profile_request','operation']]
    ];
    const first=Date.parse(history.first),span=Date.parse(history.last)-first;
    const detail=el('p',null,'meta');detail.setAttribute('aria-live','polite');
    if(span>0){
      for(const [label,kinds] of lanes){
        const lane=el('div',null,'experiment-lane'),track=el('div',null,'experiment-track');
        lane.append(el('span',label),track);b.append(lane);
        for(const s of steps.filter(s=>kinds.includes(s.kind))){
          const anchor=Date.parse(s.start||s.end);
          if(!Number.isFinite(anchor))continue;
          const end=Date.parse(s.end),start=Date.parse(s.start);
          const duration=Number.isFinite(start)&&end>start?end-start:0;
          const mark=el('button');mark.type='button';mark.className=duration?'interval':'instant';
          mark.style.left=Math.min(99.8,100*(anchor-first)/span)+'%';
          if(duration)mark.style.width=(100*duration/span)+'%';
          mark.ariaLabel=mark.title=[s.round?'R'+s.round:null,s.actor,s.model,name(s.label),
            clock(s.start)+' → '+clock(s.end),seconds(s.seconds)].filter(Boolean).join(' · ');
          mark.onclick=()=>{detail.textContent=mark.title;};track.append(mark);
        }
      }
      p(b,tr('横条表示有起止记录的区间，点表示只记录了一个时刻。点击可查看对应步骤。','Bars show measured intervals. Dots mark single timestamps. Select one to inspect the step.'),'note');b.append(detail);
    }
    const select=el('select');select.ariaLabel=tr('筛选实验步骤','Filter experiment steps');
    const all=el('option',tr('全部步骤','All steps'));select.append(all);
    for(const [label] of lanes)select.append(el('option',label));
    const results=el('div');b.append(select,results);
    function show(){results.replaceChildren();const group=lanes[select.selectedIndex-1];
      stepTable(results,group?steps.filter(s=>group[1].includes(s.kind)):steps);}
    select.onchange=show;show();
  },opened);
  if(calls.length)fold(box,tr('逐次模型调用','Individual model calls')+' ('+calls.length+')','experiment-calls',b=>stepTable(b,calls),opened);
  box.append(el('h3',tr('单次推理的阶段耗时','Stages within one inference request')));
}
function stageHistory(box,rows){
  const captures=[...(data.profile_captures||[])].sort((a,b)=>(a.round??0)-(b.round??0));
  const groups=new Map();
  for(const c of captures){
    const t=c.timing;
    if(!t){p(box,captureLabel(c)+' · '+c.id+' · '+tr('未记录阶段计时','Stage times not recorded'),'note');continue;}
    const key=JSON.stringify([c.workload_id,c.comparison_key||c.id,t.basis]);
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(c);
  }
  for(const group of groups.values()){
    const first=group[0],wrap=el('div',null,'timing-scroll');box.append(wrap);
    p(wrap,tr('调用方提供的阶段测量','Caller-recorded stage measurements'),'value');
    p(wrap,[first.workload_id,first.comparison_key,first.timing.basis].join(' · '),'meta');
    const stages=new Set(group.flatMap(c=>Object.keys(c.timing.stages_ms)));
    table(wrap,[tr('阶段（毫秒）','Stage (ms)'),...group.map(c=>captureLabel(c)+' · '+c.id)],
      [...stages].map(name=>[name,...group.map(c=>fmt(c.timing.stages_ms[name]))]));
  }
  if(groups.size)p(box,tr('同列是一次采集。子阶段可能嵌套或重叠，不能相加；HTTP 验收延迟独立测量。','Each column is one capture. Nested or overlapping stages are not additive; HTTP acceptance latency is measured separately.'),'note');
  for(const round of new Set(rows.map(r=>r.round).filter(Number.isInteger))){
    if(!captures.some(c=>c.phase==='candidate' && c.round===round))
      p(box,'R'+round+' · '+tr('未关联候选 profile','No candidate profile attached'),'note');
  }
  return groups.size>0;
}
function renderCaptures(opened){
  const box=byId('captures'),captures=(data.profile_captures||[]).filter(c=>c.duration_us>0 && c.tracks?.length && c.source?.sha256);
  const missing=data.unavailable_profiles||[];
  timelineDraws.clear();box.replaceChildren();byId('capture-section').hidden=!captures.length&&!missing.length;
  for(const c of captures.sort((a,b)=>(a.round??0)-(b.round??0))){
    const matches=c.phase==='candidate' && c.comparison_key
      ? captures.filter(b=>b.phase==='baseline' && b.comparison_key===c.comparison_key && b.workload_id===c.workload_id):[];
    captureCard(box,c,matches.length===1?matches[0]:null,opened);
  }
  for(const id of missing)p(box,id+tr(' · 采集文件不可用或未通过校验。',' · Capture files are unavailable or failed verification.'),'note');
}
function render(){
  const opened=new Set([...document.querySelectorAll('details[open]')].map(f=>f.dataset.key));
  const previousFocus=document.activeElement?.closest('details')?.dataset.key;
  document.documentElement.lang=language==='zh'?'zh-CN':'en';
  for(const [id,zh,en] of [
    ['goal-title','目标与验收条件','Goal and acceptance criteria'],['baseline-title','Profile 耗时分解 · 基线到每轮','Stage timings · baseline through each round'],
    ['captures-title','逐次 Profile · 采集前检索与请求时间线','Profile captures · prior searches and timelines'],
    ['gap-title','瓶颈及目标差距','Bottleneck and target gap'],['rounds-title','每轮依据、改动和实测','Evidence, changes and results by round'],
    ['decision-title','采纳决定','Adoption decisions'],['chart-title','性能趋势 · 全部候选方案','Performance trend · all candidates']
  ])byId(id).textContent=tr(zh,en);
  byId('language').textContent=tr('English','中文');byId('campaign').textContent=data.campaign_id;
  byId('mode').textContent=live?'READ ONLY · LIVE':'READ ONLY · OFFLINE';
  byId('connection').textContent=live?(connected?'Connected':attempted?'Disconnected':'Connecting…'):'';
  const goal=byId('goal'),base=byId('baseline'),gap=byId('gap'),rounds=byId('rounds'),decisions=byId('decisions');
  for(const box of [goal,base,gap,rounds,decisions])box.replaceChildren();
  renderStoryChecks();
  renderCaptures(opened);
  const rows=[...data.candidates].sort((a,b)=>(a.round??Infinity)-(b.round??Infinity));
  const spec=data.story?.goal||{};
  p(goal,recorded(spec.statement)||data.campaign_id,'goal');
  if(spec.metric)p(goal,recorded(spec.metric),'note');
  if(spec.baseline)p(goal,recorded(spec.baseline));
  if(spec.target)p(goal,recorded(spec.target));
  if(spec.constraints?.length){const list=el('ul');for(const c of spec.constraints)list.append(el('li',recorded(c)));goal.append(list);}
  const baseline=rows.find(r=>verifiedProfile(r)?.scope==='baseline_request');
  const profile=baseline&&verifiedProfile(baseline);
  experimentHistory(base,opened);
  const hasStageHistory=stageHistory(base,rows);
  if(profile){
    p(base,tr('已校验的基线 · 采样范围用时','Verified baseline · sampled scope duration')+'  '+fmt(profile.total)+' '+profile.metric_unit,'value');
    profileTable(base,profile);
  }else if(!hasStageHistory)p(base,tr('缺少与本轮证据哈希匹配的请求 profile。','No verified request profile is attached.'),'note');
  if(profile?.conclusion && !(data.profile_captures||[]).some(c=>c.takeaway===profile.conclusion))
    p(gap,recorded(profile.conclusion));
  const step=rows.find(r=>verifiedProfile(r)?.scope==='denoiser_step');
  if(step){const d=verifiedProfile(step);p(gap,rowLabel(step)+' · '+tr('去噪单步 GPU profile','Single denoising step GPU profile'),'value');
    profileTable(gap,d);if(d.conclusion)p(gap,recorded(d.conclusion));}
  const ref=baseline?.baseline_median,unit=baseline?.metric_unit||'',target=data.overview.target_improvement_pct;
  const scoped=Object.hasOwn(data.overview,'profile_best_improvement_pct');
  const gain=scoped?data.overview.profile_best_improvement_pct:data.overview.best_improvement_pct;
  const best=Number.isFinite(gain)?rows.find(r=>r.improvement_pct===gain && r.state==='completed' &&
    (!scoped || r.matches_profile_baseline) &&
    r.quality==='passed' && r.source_verified===true && r.decision!=='rolled_back' && ['PASS','FAIL'].includes(r.verdict)):null;
  const dl=el('dl',null,'metrics');gap.append(dl);
  if(Number.isFinite(ref))metric(dl,tr('配对验收基线','Paired acceptance baseline'),fmt(ref)+' '+unit);
  if(Number.isFinite(ref) && Number.isFinite(target) && ['minimize','maximize'].includes(baseline.direction)){
    const lower=baseline.direction==='minimize';
    metric(dl,tr('目标值','Target value'),fmt(ref*(1+(lower?-target:target)/100))+' '+unit);
  }
  if(best){
    const label=scoped?tr('同基线测量条件的最佳改善','Best improvement under baseline conditions'):tr('最佳实测改善','Best measured improvement');
    metric(dl,label+' · '+rowLabel(best),fmt(best.improvement_pct,2)+'%');
    if(Number.isFinite(target))metric(dl,tr('距目标','Gap to target'),fmt(Math.max(0,target-best.improvement_pct),2)+tr(' 个百分点',' pp'));}
  for(const r of rows){
    const it=iteration(r),trace=r.optimization_trace;
    const outer=el('details',null,'capture-fold'),name=el('summary'),a=el('article',null,'round');
    outer.dataset.key='round:'+JSON.stringify([r.round,r.candidate_id,r.run_id]);outer.open=opened.has(outer.dataset.key);
    name.append(el('span',rowLabel(r),'tag'),document.createTextNode(recorded(r.title||r.candidate_id)));
    outer.append(name,a);rounds.append(outer);
    if(r.optimization?.summary && r.optimization.summary!==r.title)p(a,recorded(r.optimization.summary));
    const skills=trace?.applied_skills||[];
    for(const skill of skills){
      const line=el('p',null,'basis');line.append(el('code',skill.name),' · ',document.createTextNode(recorded(skill.takeaway)));a.append(line);
    }
    if(!skills.length){
      const observation=trace?.steps?.items?.find(s=>s.kind==='observation' && s.result);
      const basis=observation?.result || it?.hypothesis || r.optimization?.hypothesis;
      if(basis && basis!==r.title && basis!=='Not recorded')p(a,recorded(basis),'basis');
    }
    const facts=el('div',null,'facts');a.append(facts);
    const pair=Number.isFinite(r.baseline_median) && Number.isFinite(r.candidate_median);
    if(pair){facts.append(el('span',tr('基线 → 候选','Baseline → candidate')+'  '+fmt(r.baseline_median)+' → '+fmt(r.candidate_median)+' '+(r.metric_unit||'')));}
    if(Number.isFinite(r.improvement_pct))facts.append(el('strong',fmt(r.improvement_pct,2)+'% · '+status(r.outcome)));
    facts.append(el('span',status(r.state)),el('span',tr('质量校验','Quality')+' · '+status(r.quality)));
    details(a,r,it,opened);
    const item=el('div',null,'decision'),decision=it?.decision;
    const confirmed=r.decision && r.decision!=='not_recorded';
    const outcome=confirmed?r.decision:'not_recorded';
    item.append(el('code',rowLabel(r)),el('strong',status(outcome)));
    if(confirmed && decision?.outcome===outcome && (!decision.candidate_id || decision.candidate_id===r.candidate_id))
      item.append(el('span',recorded(decision.reason),'note'));
    decisions.append(item);
  }
  if(!rows.length){p(rounds,tr('尚无轮次记录。','No rounds recorded.'));p(decisions,dash);}
  byId('chart-note').textContent=tr('各点为同轮基线与候选的实测比值。候选独立比较，缺少测量的轮次留空。','Each point compares a candidate with its paired baseline. Missing measurements are omitted.');
  const separate=rows.filter(r=>r.matches_profile_baseline===false && r.baseline_median>0 && r.candidate_median>0);
  for(const r of separate){
    const ratio=r.direction==='minimize'?r.baseline_median/r.candidate_median:r.candidate_median/r.baseline_median;
    p(byId('chart-note'),rowLabel(r)+' · '+fmt(ratio,3)+'× · '+status(r.outcome)+
      tr('。设备或测量条件与基线轮不同，仅列本轮比值，不连线。','. Different device or measurement conditions; paired ratio shown separately.'));
  }
  const chartBox=byId('chart');chartBox.innerHTML=chart;
  if(!chart)chartBox.textContent=tr('暂无可比测量。','No comparable measurements.');
  else if(language==='zh'){
    const labels={'Performance by recorded round':'按轮次记录的性能','Speedup index':'加速指数','Speedup vs paired baseline':'相对配对基线的加速比','Recorded round':'已记录轮次','baseline: paired baseline':'基线：配对基线','Baseline':'基线','baseline':'基线','Recorded rounds':'已记录轮次','Target':'目标','noise':'噪声范围内','improved':'改善','regressed':'回退','failed':'失败','rolled back':'已回滚'};
    for(const n of chartBox.querySelectorAll('svg text,svg title')){
      const parts=n.textContent.split(' · ');n.textContent=parts.map(s=>labels[s]||s).join(' · ');
    }
  }
  if(previousFocus){for(const node of document.querySelectorAll('details'))if(node.dataset.key===previousFocus)node.querySelector('summary').focus({preventScroll:true});}
}
byId('language').addEventListener('click',()=>{
  language=language==='zh'?'en':'zh';try{localStorage.setItem('inferrsi.dashboard.language',language);}catch{}
  render();
});
async function poll(){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
  try{
    const headers={'X-InferRSI-Compact':'1'};if(etag)headers['If-None-Match']=etag;
    const response=await fetch('/api/state',{headers,signal:controller.signal,cache:'no-store'});
    if(response.status!==304){
      if(!response.ok)throw Error('snapshot unavailable');
      const next=await response.json();
      if(next.data.review_layout!=='profile_first'){location.reload();return;}
      data=next.data;chart=next.chart;render();etag=response.headers.get('ETag');
    }
    connected=true;
  }catch{connected=false;}
  finally{clearTimeout(timer);attempted=true;byId('connection').textContent=connected?'Connected':'Disconnected';setTimeout(poll,3000);}
}
render();if(live)poll();
})();
</script>
