<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="generator" content="InferRSI dashboard">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>InferRSI · 实验复盘</title>
<style>
:root{color-scheme:dark;--bg:#121519;--panel:#181b1f;--line:#343b43;--sub:#aeb8c4;--text:#ecf0f3;--accent:#86c8ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
main,header>div{width:min(1080px,calc(100% - 48px));margin:auto}
header{border-bottom:1px solid var(--line);background:var(--panel)}
header>div{display:flex;align-items:center;gap:14px;min-height:52px;flex-wrap:wrap;padding:8px 0}
header strong{font-weight:650;letter-spacing:.02em}header small{color:var(--sub)}
#connection{color:var(--accent)}#language{margin-left:auto}
button,summary{cursor:pointer;color:var(--accent)}
button{background:transparent;border:1px solid var(--line);border-radius:4px;padding:.35em .8em}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{padding:28px 0 58px}
section{margin-bottom:24px;padding:20px 24px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
h1,h2,h3,p,figure,dl{margin:0}h1,h2{font-size:20px;line-height:1.35;margin-bottom:12px}h3{font-size:16px}
p+p{margin-top:6px}.goal{font-size:19px;font-weight:550}.note,small,dt{color:var(--sub)}
ul{margin:.45em 0 0;padding-left:1.35em}code,pre,.value,td{font-variant-numeric:tabular-nums}
code,pre{font-family:Consolas,"Microsoft YaHei",monospace}code{overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0 0}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px 9px 7px 0;vertical-align:top}
th{font-size:13px;color:var(--sub);font-weight:500}.value{font-weight:650}
.metrics{display:flex;gap:18px 40px;flex-wrap:wrap;margin:14px 0}
.metrics dd{margin:2px 0 0;font-weight:650;font-size:22px;line-height:1.4}.metrics dt{font-size:13px}
.round{border-top:1px solid var(--line);padding:16px 0}.round h3,.round p{overflow-wrap:anywhere}
.round .facts{display:flex;gap:6px 22px;flex-wrap:wrap;padding:4px 0;color:var(--accent);font-size:14px}
.round .basis{color:var(--sub);font-size:14px}.round .basis code{color:var(--text)}
.tag{display:inline-block;margin-right:8px;color:var(--accent);font-size:13px}
details{margin-top:8px;font-size:13px}details details{margin-left:10px}
details p,details pre{margin:5px 0 4px 12px;overflow-wrap:anywhere}
pre{max-height:22rem;overflow:auto;white-space:pre-wrap;padding:9px 12px;background:var(--bg);color:var(--sub)}
figure{padding-top:14px;border-top:1px solid var(--line)}figcaption{font-weight:600}#chart{overflow-x:auto}#chart svg{display:block;width:100%;min-width:580px;height:auto}
.decisions{display:grid;gap:8px}.decision{display:grid;grid-template-columns:4em 9em 1fr;gap:12px;border-top:1px solid var(--line);padding-top:8px}
@media(max-width:640px){main,header>div{width:calc(100% - 24px)}section{padding:15px;margin-bottom:14px}main{padding:18px 0}.metrics{gap:10px 20px}.decision{grid-template-columns:3em 1fr;gap:4px}.decision .note{grid-column:2}header>div{gap:8px}.goal{font-size:17px}}
</style>
</head>
<body>
<header><div><strong>InferRSI</strong><code id="campaign"></code><small id="mode"></small><small id="connection" role="status"></small><button id="language" type="button"></button></div></header>
<main>
<section aria-labelledby="goal-title"><h1 id="goal-title"></h1><div id="goal"></div></section>
<section aria-labelledby="baseline-title"><h2 id="baseline-title"></h2><div id="baseline"></div></section>
<section aria-labelledby="gap-title"><h2 id="gap-title"></h2><div id="gap"></div></section>
<section aria-labelledby="rounds-title"><h2 id="rounds-title"></h2><div id="rounds"></div><figure><figcaption id="chart-title"></figcaption><small id="chart-note"></small><div id="chart">__DASHBOARD_CHART__</div></figure></section>
<section aria-labelledby="decision-title"><h2 id="decision-title"></h2><div class="decisions" id="decisions"></div></section>
</main>
<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
(() => {
'use strict';
const byId=id=>document.getElementById(id);
let data=JSON.parse(byId('dashboard-data').textContent);
const live=data.live===true;
let language='zh';
try { language=localStorage.getItem('inferrsi.dashboard.language')==='en'?'en':'zh'; } catch {}
let chart=byId('chart').innerHTML, connected=false, attempted=false, etag=null;
const tr=(zh,en)=>language==='zh'?zh:en;
const recorded=text=>{
  const overlay=data.translations?.[language];
  return typeof text==='string' && overlay && Object.hasOwn(overlay,text)?overlay[text]:text;
};
const dash='—', fmt=(v,n=3)=>Number.isFinite(v)?v.toFixed(n):dash;
const rowLabel=r=>Number.isInteger(r.round)?'R'+r.round:r.candidate_id;
function el(tag,text,cls){
  const item=document.createElement(tag);
  if(text!=null)item.textContent=String(text);
  if(cls)item.className=cls;
  return item;
}
const p=(parent,text,cls)=>parent.append(el('p',text,cls));
function metric(dl,label,value){
  const pair=el('div');pair.append(el('dt',label),el('dd',value));dl.append(pair);
}
function table(parent,headers,rows){
  const t=el('table'), head=t.createTHead().insertRow();
  for(const label of headers){const th=el('th',label);th.scope='col';head.append(th);}
  const body=t.createTBody();
  for(const values of rows){const row=body.insertRow();for(const value of values)row.insertCell().textContent=value;}
  parent.append(t);
}
function fold(parent,label,key,draw,opened){
  const f=el('details');f.dataset.key=key;f.append(el('summary',label));
  const content=el('div');f.append(content);parent.append(f);
  let built=false;
  function fill(){if(f.open&&!built){built=true;draw(content);}}
  f.addEventListener('toggle',fill);
  if(opened.has(key)){f.open=true;fill();}
}
function verifiedProfile(r){
  const d=r.optimization_trace?.diagnosis, ref=r.artifacts?.profile;
  return d && ref?.state==='present' && /^[a-f0-9]{64}$/i.test(ref.sha256) &&
    ref.sha256.toLowerCase()===d.source_sha256?.toLowerCase()?d:null;
}
function median(values){
  const a=[...values].sort((x,y)=>x-y),i=Math.floor(a.length/2);
  return a.length%2?a[i]:(a[i-1]+a[i])/2;
}
function range(values){
  const lo=Math.min(...values),hi=Math.max(...values);
  return lo===hi?fmt(lo,3):fmt(lo,3)+'–'+fmt(hi,3);
}
function iteration(r){
  return data.story?.iterations?.find(i=>i.round===r.round && i.candidates.some(c=>c.candidate_id===r.candidate_id));
}
function profileTable(box,d){
  table(box,[tr('阶段或算子','Stage or operator'),tr('耗时范围','Measured range')+' ('+d.metric_unit+')',
    tr('中位数','Median')+' ('+d.metric_unit+')'],
    d.components.map(c=>[recorded(c.name),range(c.samples),fmt(median(c.samples))]));
}
function status(state){
  const zh={completed:'已完成',running:'运行中',cancelled:'已中止',failed:'失败',crashed:'异常退出',queued:'已排队',
    passed:'通过',not_recorded:'未记录',pending:'待决策',adopted:'已采纳',rejected:'未采纳',rolled_back:'已回滚',
    no_gain:'未见收益',noise:'噪声范围内',regressed:'回退',improved:'改善',quality_failed:'质量检查失败'};
  return language==='zh'?(zh[state]||state||dash):(state||dash).replaceAll('_',' ');
}
function raw(parent,value){parent.append(el('pre',typeof value==='string'?value:JSON.stringify(value,null,2)));}
function details(box,r,it,opened){
  const key=JSON.stringify([r.round,r.candidate_id,r.run_id]);
  fold(box,tr('轮次详情','Round details'),key,body=>{
    for(const id of it?.context_ids||[]){
      const capture=data.story?.retrievals?.find(c=>c.context_id===id);
      if(!capture)continue;
      fold(body,tr('检索记录','Retrieval')+' · '+id,key+'-capture-'+id,b=>{
        if(capture.purpose)p(b,recorded(capture.purpose),'value');
        for(const note of capture.takeaways||[])p(b,recorded(note));
        const found=capture.selection?.matched_count,shown=capture.selection?.returned_count;
        if(Number.isInteger(found) && Number.isInteger(shown))
          p(b,tr('匹配 '+found+' 条，返回 '+shown+' 条。',found+' matched; '+shown+' returned.'));
        raw(b,{request:capture.request,selection:capture.selection,items:capture.items,files:capture.contexts,
          used_refs:capture.used_refs,rejected_refs:capture.rejected_refs,omissions:capture.omissions,
          context_omissions:capture.context_omissions,state:capture.state,sha256:capture.expected_sha256});
        if(capture.state==='verified')raw(b,capture.assembled_text);
      },opened);
    }
    const trace=r.optimization_trace;
    if(trace){
      for(const s of trace.steps?.items||[]){
        p(body,s.sequence+'. '+recorded(s.action),'value');
        if(s.motivation)p(body,recorded(s.motivation),'note');
        if(s.result)p(body,recorded(s.result));
      }
    }
    if(trace)fold(body,tr('轮次原始 trace','Recorded round trace'),key+'-trace',b=>{
      const text=trace.context?.text;
      const context=text && typeof text==='object'?{...trace.context,text:data._context_pool?.[text.$context]}:trace.context;
      raw(b,{...trace,context});
    },opened);
    fold(body,tr('证据文件与哈希','Evidence files and hashes'),key+'-artifacts',b=>raw(b,r.artifacts),opened);
    fold(body,tr('运行事件','Run events'),key+'-events',b=>raw(b,[...(r.events||[]),...(r.unlinked_agent_events||[])]),opened);
    fold(body,tr('配对样本与计时口径','Paired samples and timing'),key+'-samples',b=>raw(b,r.benchmark_context),opened);
  },opened);
}
function render(){
  const opened=new Set([...document.querySelectorAll('details[open]')].map(f=>f.dataset.key));
  const previousFocus=document.activeElement?.closest('details')?.dataset.key;
  document.documentElement.lang=language==='zh'?'zh-CN':'en';
  for(const [id,zh,en] of [
    ['goal-title','目标与验收条件','Goal and acceptance criteria'],['baseline-title','基线耗时分解','Baseline timing'],
    ['gap-title','瓶颈及目标差距','Bottleneck and target gap'],['rounds-title','每轮依据、改动和实测','Evidence, changes and results by round'],
    ['decision-title','采纳决定','Adoption decisions'],['chart-title','性能趋势 · 全部候选方案','Performance trend · all candidates']
  ])byId(id).textContent=tr(zh,en);
  byId('language').textContent=tr('English','中文');byId('campaign').textContent=data.campaign_id;
  byId('mode').textContent=live?'READ ONLY · LIVE':'READ ONLY · OFFLINE';
  byId('connection').textContent=live?(connected?'Connected':attempted?'Disconnected':'Connecting…'):'';
  const goal=byId('goal'),base=byId('baseline'),gap=byId('gap'),rounds=byId('rounds'),decisions=byId('decisions');
  for(const box of [goal,base,gap,rounds,decisions])box.replaceChildren();
  const rows=[...data.candidates].sort((a,b)=>(a.round??Infinity)-(b.round??Infinity));
  const spec=data.story?.goal||{};
  p(goal,recorded(spec.statement)||data.campaign_id,'goal');
  if(spec.metric)p(goal,recorded(spec.metric),'note');
  if(spec.baseline)p(goal,recorded(spec.baseline));
  if(spec.target)p(goal,recorded(spec.target));
  if(spec.constraints?.length){const list=el('ul');for(const c of spec.constraints)list.append(el('li',recorded(c)));goal.append(list);}
  const baseline=rows.find(r=>verifiedProfile(r)?.scope==='baseline_request');
  const profile=baseline&&verifiedProfile(baseline);
  if(profile){
    p(base,rowLabel(baseline)+' · '+tr('预热后端到端中位数','Warm end-to-end median')+'  '+fmt(profile.total)+' '+profile.metric_unit,'value');
    profileTable(base,profile);
  }else p(base,tr('缺少与本轮证据哈希匹配的请求 profile。','No verified request profile is attached.'),'note');
  if(profile?.conclusion)p(gap,recorded(profile.conclusion));
  const step=rows.find(r=>verifiedProfile(r)?.scope==='denoiser_step');
  if(step){const d=verifiedProfile(step);p(gap,rowLabel(step)+' · '+tr('去噪单步 GPU profile','Single denoising step GPU profile'),'value');
    profileTable(gap,d);if(d.conclusion)p(gap,recorded(d.conclusion));}
  const ref=baseline?.baseline_median,unit=baseline?.metric_unit||'',target=data.overview.target_improvement_pct;
  const scoped=Object.hasOwn(data.overview,'profile_best_improvement_pct');
  const gain=scoped?data.overview.profile_best_improvement_pct:data.overview.best_improvement_pct;
  const best=Number.isFinite(gain)?rows.find(r=>r.improvement_pct===gain && r.state==='completed' &&
    (!scoped || r.matches_profile_baseline) &&
    r.quality==='passed' && r.source_verified===true && r.decision!=='rolled_back' && ['PASS','FAIL'].includes(r.verdict)):null;
  const dl=el('dl',null,'metrics');gap.append(dl);
  if(Number.isFinite(ref))metric(dl,tr('配对验收基线','Paired acceptance baseline'),fmt(ref)+' '+unit);
  if(Number.isFinite(ref) && Number.isFinite(target) && baseline.direction==='minimize'){
    metric(dl,tr('目标延迟','Target latency'),fmt(ref*(1-target/100))+' '+unit);
  }
  if(best){metric(dl,tr('最佳实测降幅','Best measured reduction')+' · '+rowLabel(best),fmt(best.improvement_pct,2)+'%');
    if(Number.isFinite(target))metric(dl,tr('距目标','Gap to target'),fmt(Math.max(0,target-best.improvement_pct),2)+tr(' 个百分点',' pp'));}
  for(const r of rows){
    const it=iteration(r),trace=r.optimization_trace;
    const a=el('article',null,'round'),name=el('h3');
    name.append(el('span',rowLabel(r),'tag'),document.createTextNode(recorded(r.title||r.candidate_id)));a.append(name);rounds.append(a);
    if(r.optimization?.summary && r.optimization.summary!==r.title)p(a,recorded(r.optimization.summary));
    const skills=trace?.applied_skills||[];
    for(const skill of skills){
      const line=el('p',null,'basis');line.append(el('code',skill.name),' · ',document.createTextNode(recorded(skill.takeaway)));a.append(line);
    }
    if(!skills.length){
      const observation=trace?.steps?.items?.find(s=>s.kind==='observation' && s.result);
      const basis=observation?.result || it?.hypothesis || r.optimization?.hypothesis;
      if(basis && basis!==r.title && basis!=='Not recorded')p(a,recorded(basis),'basis');
    }
    const facts=el('div',null,'facts');a.append(facts);
    const pair=Number.isFinite(r.baseline_median) && Number.isFinite(r.candidate_median);
    if(pair){facts.append(el('span',tr('基线 → 候选','Baseline → candidate')+'  '+fmt(r.baseline_median)+' → '+fmt(r.candidate_median)+' '+(r.metric_unit||'')));}
    if(Number.isFinite(r.improvement_pct))facts.append(el('strong',fmt(r.improvement_pct,2)+'% · '+status(r.outcome)));
    facts.append(el('span',status(r.state)),el('span',tr('质量校验','Quality')+' · '+status(r.quality)));
    details(a,r,it,opened);
    const item=el('div',null,'decision'),decision=it?.decision;
    const confirmed=r.decision && r.decision!=='not_recorded';
    const outcome=confirmed?r.decision:'not_recorded';
    item.append(el('code',rowLabel(r)),el('strong',status(outcome)));
    if(confirmed && decision?.outcome===outcome && (!decision.candidate_id || decision.candidate_id===r.candidate_id))
      item.append(el('span',recorded(decision.reason),'note'));
    decisions.append(item);
  }
  if(!rows.length){p(rounds,tr('尚无轮次记录。','No rounds recorded.'));p(decisions,dash);}
  byId('chart-note').textContent=tr('各点为同轮基线与候选的实测比值。候选独立比较，缺少测量的轮次留空。','Each point compares a candidate with its paired baseline. Missing measurements are omitted.');
  const separate=rows.filter(r=>r.matches_profile_baseline===false && r.baseline_median>0 && r.candidate_median>0);
  for(const r of separate){
    const ratio=r.direction==='minimize'?r.baseline_median/r.candidate_median:r.candidate_median/r.baseline_median;
    p(byId('chart-note'),rowLabel(r)+' · '+fmt(ratio,3)+'× · '+status(r.outcome)+
      tr('。设备或测量条件与基线轮不同，仅列本轮比值，不连线。','. Different device or measurement conditions; paired ratio shown separately.'));
  }
  const chartBox=byId('chart');chartBox.innerHTML=chart;
  if(!chart)chartBox.textContent=tr('暂无可比测量。','No comparable measurements.');
  else if(language==='zh'){
    const labels={'Performance by recorded round':'按轮次记录的性能','Speedup index':'加速指数','Speedup vs paired baseline':'相对配对基线的加速比','Recorded round':'已记录轮次','baseline: paired baseline':'基线：配对基线','Baseline':'基线','baseline':'基线','Recorded rounds':'已记录轮次','Target':'目标','noise':'噪声范围内','improved':'改善','regressed':'回退','failed':'失败','rolled back':'已回滚'};
    for(const n of chartBox.querySelectorAll('svg text,svg title')){
      const parts=n.textContent.split(' · ');n.textContent=parts.map(s=>labels[s]||s).join(' · ');
    }
  }
  if(previousFocus){for(const node of document.querySelectorAll('details'))if(node.dataset.key===previousFocus)node.querySelector('summary').focus({preventScroll:true});}
}
byId('language').addEventListener('click',()=>{
  language=language==='zh'?'en':'zh';try{localStorage.setItem('inferrsi.dashboard.language',language);}catch{}
  render();
});
async function poll(){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
  try{
    const headers={'X-InferRSI-Compact':'1'};if(etag)headers['If-None-Match']=etag;
    const response=await fetch('/api/state',{headers,signal:controller.signal,cache:'no-store'});
    if(response.status!==304){
      if(!response.ok)throw Error('snapshot unavailable');
      const next=await response.json();
      if(next.data.review_layout!=='profile_first'){location.reload();return;}
      data=next.data;chart=next.chart;render();etag=response.headers.get('ETag');
    }
    connected=true;
  }catch{connected=false;}
  finally{clearTimeout(timer);attempted=true;byId('connection').textContent=connected?'Connected':'Disconnected';setTimeout(poll,3000);}
}
render();if(live)poll();
})();
</script>
</body>
</html>
